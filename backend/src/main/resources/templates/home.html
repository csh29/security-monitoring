<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>보안취약점 모니터링 대시보드</title>
    <link rel="stylesheet" href="/css/common-ui.css">
    <style>
        /* 화면 공통 뼈대(:root, .app-shell 등)는 common-ui.css가 담당한다. 여기는 이 화면 전용
           위젯(KPI 카드, 막대 차트, 검색바)만 남긴다. */

        /* 홈은 두 기능(라이브러리 취약점 / 시큐어코딩)을 좌우 카드로 나란히 둔다. 예전엔 같은 KPI 3칸 묶음을 위아래로
           두 번 쌓아서 복사해 붙인 것처럼 보였고, 두 기능을 비교하려면 위아래를 오가야 했다. */
        #homePanel{ display:flex; flex-direction:column; gap:20px; }
        .overview{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:20px; }
        .domain-card{
            background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
            padding:20px 22px; display:flex; flex-direction:column; gap:16px;
        }
        .domain-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
        .domain-title{ font-size:15px; font-weight:800; color:var(--navy); }
        .domain-desc{ font-size:12px; color:var(--text-sub); margin-top:4px; }
        .domain-link{
            flex:none; border:none; background:none; cursor:pointer; font:inherit;
            font-size:12px; font-weight:700; color:var(--accent); white-space:nowrap;
        }
        .domain-link:hover{ text-decoration:underline; }

        /* 대표 수치 하나(조치할 건수) + 보조 비율 둘. 0건이면 경고색을 빼서 "할 일 없음"이 한눈에 보이게 한다. */
        .domain-main{ display:flex; align-items:baseline; gap:6px; }
        .domain-main .big{ font-size:40px; font-weight:800; line-height:1; color:var(--accent); }
        .domain-main.is-zero .big{ color:var(--navy); }
        .domain-main .unit{ font-size:16px; font-weight:700; color:var(--navy); }
        .domain-main .big-lbl{ font-size:13px; color:var(--text-sub); margin-left:8px; }
        .domain-stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .domain-stats > div{ background:var(--bg); border-radius:10px; padding:10px 14px; }
        .domain-stats b{ display:block; font-size:18px; font-weight:800; color:var(--navy); }
        .domain-stats span{ display:block; font-size:11.5px; color:var(--text-sub); margin-top:2px; }

        .domain-bars-title{ font-size:12px; font-weight:700; color:var(--text-sub); padding-top:14px; border-top:1px solid var(--line); }

        /* 가로 막대 차트(fragments/app-bars.html) */
        .bars-empty{ font-size:13px; color:var(--text-sub); margin-top:10px; }
        .bars{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
        .bar-row{ display:grid; grid-template-columns:96px 1fr; align-items:center; gap:12px; }
        .bar-row .cap{ font-size:12px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .bar-row .track{ display:flex; align-items:center; gap:8px; }
        .bar-row .fill{ height:10px; border-radius:3px; background:var(--accent); }
        .bar-row .num{ font-size:11px; color:var(--text-sub); }

        /* 검색 바 */
        .search{
            display:flex; align-items:center; gap:10px;
            border:1px solid var(--line); border-radius:var(--radius-md);
            padding:13px 16px; background:#fafafd;
            font-size:13px; color:#b6b6cc;
        }

        /* 결과 박스 */
        .result{ border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px; }
        .result p{ font-size:13px; line-height:1.7; }
        .result .src{
            display:inline-block; margin-top:12px;
            background:var(--navy); color:#fff;
            font-size:11px; padding:6px 12px; border-radius:6px;
        }

        /* 좁으면 위아래로 — 카드 하나가 막대 이름·숫자를 담기엔 480px 아래부터 비좁다. */
        @media (max-width:1100px){
            .overview{ grid-template-columns:1fr; }
        }

        /* 홈 화면이 탭 셸 역할도 한다 — 사이드바에서 홈 외 메뉴를 열면 이 안에 탭(iframe)이
           쌓인다. 탭이 있을 땐 홈 내용을 숨기고 탭 영역을 그 자리(.area-main)에 꽉 채운다. */
        .area-main{ position:relative; }
        #homePanel.hidden{ display:none; }
        #tabPanels{ display:none; position:absolute; inset:0; background:var(--bg); }
        #tabPanels.active{ display:block; }
        #tabPanels .tab-iframe{ display:none; width:100%; height:100%; border:none; }
    </style>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div th:replace="~{fragments/loading-overlay :: overlay}"></div>

    <main class="area-main">
        <div id="homePanel">
            <!-- 사이드바의 두 기능 그룹과 같은 이름·순서. 카드마다 "조치할 건수" 하나를 크게, 비율 둘을 작게 보여준다.
                 링크는 사이드바 메뉴를 대신 눌러 탭으로 연다(tabs.js — 홈이 탭 셸이라 일반 링크로 가면 탭 화면을 벗어난다). -->
            <div class="overview">
                <section class="domain-card">
                    <div class="domain-head">
                        <div>
                            <div class="domain-title">라이브러리 취약점</div>
                            <div class="domain-desc">의존성의 알려진 CVE (NVD·OSV)</div>
                        </div>
                        <button type="button" class="domain-link" data-open-menu="vulnerability-mng">취약점 관리 ›</button>
                    </div>
                    <div class="domain-main" th:classappend="${totalOpenVulnerabilities == 0} ? 'is-zero'">
                        <span class="big" th:text="${totalOpenVulnerabilities}">0</span><span class="unit">건</span>
                        <span class="big-lbl">미해결</span>
                    </div>
                    <div class="domain-stats">
                        <div><b th:text="|${openCriticalRate}%|">0%</b><span>미해결 중 크리티컬</span></div>
                        <div><b th:text="|${averageResolutionRate}%|">0%</b><span>조치 완료율</span></div>
                    </div>
                    <div>
                        <div class="domain-bars-title">프로젝트별 미해결 TOP 5</div>
                        <div th:replace="~{fragments/app-bars :: appBars(${appVulnerabilityCounts}, '등록된 앱이 없습니다.')}"></div>
                    </div>
                </section>

                <!-- 탐지가 하나도 없으면 비율 대신 "-" — 점검 전 상태가 "처리율 0%/100%"로 읽히지 않게(SecureCodeFindingService.summarize). -->
                <section class="domain-card">
                    <div class="domain-head">
                        <div>
                            <div class="domain-title">시큐어코딩</div>
                            <div class="domain-desc">소스 코드의 보안약점 (행안부 기준 · Semgrep)</div>
                        </div>
                        <button type="button" class="domain-link" data-open-menu="secure-code-mng">코드 점검 결과 ›</button>
                    </div>
                    <div class="domain-main" th:classappend="${secureCode.openCount == 0} ? 'is-zero'">
                        <span class="big" th:text="${secureCode.openCount}">0</span><span class="unit">건</span>
                        <span class="big-lbl">미조치</span>
                    </div>
                    <div class="domain-stats">
                        <div><b th:text="${secureCode.scanned} ? |${secureCode.openHighRate}%| : '-'">-</b><span>미조치 중 HIGH</span></div>
                        <div><b th:text="${secureCode.scanned} ? |${secureCode.handledRate}%| : '-'">-</b><span>처리율 (조치·오탐·위험수용)</span></div>
                    </div>
                    <div>
                        <div class="domain-bars-title">프로젝트별 미조치 TOP 5</div>
                        <div th:replace="~{fragments/app-bars :: appBars(${secureCode.topApps}, ${secureCode.scanned} ? '등록된 앱이 없습니다.' : '아직 코드 점검을 하지 않았습니다. 시큐어코딩 > 코드 점검에서 실행하세요.')}"></div>
                    </div>
                </section>
            </div>

            <div class="search"><span>⌕</span><span>이번주 크리티컬 등급 취약점은?</span></div>

            <div class="result">
                <p>CRM 프로젝트의 lodash 4.17.15가 CVE-2021-23337(CVSS 7.2)에 해당하며 즉시 조치가 필요합니다.</p>
                <span class="src">출처 · NVD·OSV.dev 2026.08</span>
            </div>
        </div>

        <div id="tabPanels"></div>
    </main>
</div>

<script src="/js/tabs.js"></script>
<script>
    // 카드의 "… ›" 버튼 — 같은 화면의 사이드바 메뉴를 대신 눌러 탭 동작(tabs.js)을 그대로 쓴다.
    document.querySelectorAll('[data-open-menu]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            const link = document.querySelector('.nav a[data-menu="' + btn.dataset.openMenu + '"]');
            if (link) link.click();
        });
    });
</script>
</body>
</html>
