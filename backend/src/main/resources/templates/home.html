<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>보안취약점 모니터링 대시보드</title>
    <link rel="stylesheet" href="/css/common-ui.css">
    <style>
        /* 화면 공통 뼈대(:root, .app-shell 등)는 common-ui.css가 담당한다. 여기는 이 화면 전용
           위젯(KPI 카드, 막대 차트, 검색바)만 남긴다. */

        /* KPI 3열 */
        .kpi-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
        .kpi{
            background:var(--navy); color:#fff;
            border-radius:var(--radius-md); padding:20px 22px;
        }
        .kpi .val{ font-size:30px; font-weight:800; color:var(--accent); line-height:1; }
        .kpi .lbl{ font-size:12px; color:#c9c9dd; margin-top:10px; }

        /* 가로 막대 차트 */
        .panel-title{ font-size:13px; font-weight:700; color:var(--text-sub); }
        .bars{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
        .bar-row{ display:grid; grid-template-columns:110px 1fr; align-items:center; gap:12px; }
        .bar-row .cap{ font-size:12px; text-align:right; }
        .bar-row .track{ display:flex; align-items:center; gap:8px; }
        .bar-row .fill{ height:12px; border-radius:3px; background:var(--accent); }
        .bar-row .num{ font-size:11px; color:var(--text-sub); }

        /* 검색 바 */
        .search{
            display:flex; align-items:center; gap:10px;
            border:1px solid var(--line); border-radius:var(--radius-md);
            padding:13px 16px; background:#fafafd;
            font-size:13px; color:#b6b6cc;
        }

        /* 결과 박스 */
        .result{ border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px; }
        .result p{ font-size:13px; line-height:1.7; }
        .result .src{
            display:inline-block; margin-top:12px;
            background:var(--navy); color:#fff;
            font-size:11px; padding:6px 12px; border-radius:6px;
        }

        @media (max-width:760px){
            .kpi-row{ grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div th:replace="~{fragments/loading-overlay :: overlay}"></div>

    <main class="area-main">
        <section class="kpi-row">
            <div class="kpi"><div class="val" th:text="|${totalOpenVulnerabilities}건|">12건</div><div class="lbl">전체 미해결 취약점</div></div>
            <div class="kpi"><div class="val" th:text="|${openCriticalRate}%|">95%</div><div class="lbl">미해결 크리티컬 비율</div></div>
            <div class="kpi"><div class="val" th:text="|${averageResolutionRate}%|">78%</div><div class="lbl">평균 조치 완료율</div></div>
        </section>

        <section>
            <div class="panel-title">프로젝트별 미해결 취약점 TOP 5 (건수)</div>
            <div class="bars" th:if="${not #lists.isEmpty(appVulnerabilityCounts)}">
                <div class="bar-row" th:each="count : ${appVulnerabilityCounts}">
                    <span class="cap" th:text="${count.systemName}">시스템명</span>
                    <span class="track">
                        <i class="fill" th:style="|width:${appVulnerabilityCounts[0].openCount > 0 ? count.openCount * 100 / appVulnerabilityCounts[0].openCount : 0}%|"></i>
                        <span class="num" th:text="${count.openCount}">0</span>
                    </span>
                </div>
            </div>
            <p th:if="${#lists.isEmpty(appVulnerabilityCounts)}" style="font-size:13px; color:var(--text-sub);">
                미해결 취약점이 없습니다.
            </p>
        </section>

        <div class="search"><span>⌕</span><span>이번주 크리티컬 등급 취약점은?</span></div>

        <div class="result">
            <p>CRM 프로젝트의 lodash 4.17.15가 CVE-2021-23337(CVSS 7.2)에 해당하며 즉시 조치가 필요합니다.</p>
            <span class="src">출처 · NVD·OSV.dev 2026.08</span>
        </div>
    </main>
</div>
</body>
</html>
