<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="overlay">
    <div id="globalLoadingOverlay" class="global-loading-overlay">
        <style>
            .global-loading-overlay{
                display:none; position:fixed; inset:0; z-index:9999;
                background:rgba(255,255,255,0.6);
                align-items:center; justify-content:center;
                cursor:wait;
            }
            .global-loading-overlay.active{ display:flex; }
            .global-loading-overlay .spinner{
                width:44px; height:44px;
                border:5px solid #e8e8f2; border-top-color:#f43f68;
                border-radius:50%;
                animation:global-loading-spin .8s linear infinite;
            }
            @keyframes global-loading-spin{ to{ transform:rotate(360deg); } }
        </style>
        <div class="spinner"></div>
    </div>

    <!-- 화면 공통 펑션키(F3 조회/F4 신규/F5 삭제/F9 저장/F12 초기화). 모든 화면이 이 조각을 포함하므로 여기서 싣는다. -->
    <script src="/js/hotkeys.js"></script>
    <!-- 권한에 따라 있을 수도 없을 수도 있는 공통 버튼에 핸들러를 거는 헬퍼(PageButtons.bind). -->
    <script src="/js/page-buttons.js"></script>
    <!-- 그리드 우클릭 "엑셀 다운로드"가 쓰는 xlsx 작성기(grid.js는 누를 때 XlsxWriter를 찾는다). -->
    <script src="/js/xlsx-writer.js"></script>
    <script>
        (function () {
            var overlay = document.getElementById('globalLoadingOverlay');
            if (!overlay || overlay.dataset.wired) return;
            overlay.dataset.wired = 'true';

            var pending = 0;

            function show() {
                pending++;
                overlay.classList.add('active');
            }

            function hide() {
                pending = Math.max(0, pending - 1);
                if (pending === 0) {
                    overlay.classList.remove('active');
                }
            }

            // CSRF 쿠키(XSRF-TOKEN, SecurityConfig의 CookieCsrfTokenRepository가 심어준다)를
            // 읽어서 상태를 바꾸는 요청(POST/PUT/PATCH/DELETE)에 X-XSRF-TOKEN 헤더로 그대로
            // 실어 보낸다. 화면마다 fetch 호출 자리에서 따로 챙기지 않도록, 아래에서 감싸는
            // 공통 fetch 래퍼 한 곳에서 처리한다.
            var CSRF_COOKIE_NAME = 'XSRF-TOKEN';
            var CSRF_HEADER_NAME = 'X-XSRF-TOKEN';
            var STATE_CHANGING_METHODS = ['POST', 'PUT', 'PATCH', 'DELETE'];

            function readCsrfCookie() {
                var match = document.cookie.match(new RegExp('(?:^|; )' + CSRF_COOKIE_NAME + '=([^;]*)'));
                return match ? decodeURIComponent(match[1]) : null;
            }

            function withCsrfHeader(input, init) {
                var isRequestObject = typeof Request !== 'undefined' && input instanceof Request;
                var method = ((init && init.method) || (isRequestObject ? input.method : 'GET') || 'GET').toUpperCase();
                if (STATE_CHANGING_METHODS.indexOf(method) === -1) {
                    return init;
                }
                var token = readCsrfCookie();
                if (!token) {
                    return init;
                }
                var headers = new Headers((init && init.headers) || (isRequestObject ? input.headers : undefined));
                headers.set(CSRF_HEADER_NAME, token);
                return Object.assign({}, init, { headers: headers });
            }

            // 화면의 조회/저장/삭제 버튼은 전부 fetch로 API를 호출하므로,
            // fetch 자체를 감싸서 어떤 화면이든 API 호출 중에는 전체 화면에 스피너를 띄우고
            // 오버레이가 클릭/키 이벤트를 가로채 아래 화면과의 상호작용을 막는다.
            // 로그인이 풀린 상태(세션 만료·서버 재기동)에서 API를 부르면 서버가 401을 준다(SecurityConfig).
            // 그때는 화면별 오류 처리("조회에 실패했습니다" 알림 등)까지 가지 않도록 여기서 멈추고,
            // 탭(iframe) 안이더라도 창 전체를 로그인 페이지로 보낸다.
            var LOGIN_URL = '/login';
            var redirectingToLogin = false;

            function redirectToLogin() {
                if (!redirectingToLogin) {
                    redirectingToLogin = true;
                    window.top.location.href = LOGIN_URL;
                }
                return new Promise(function () {}); // 끝나지 않는 Promise — 화면의 then/catch가 실행되지 않는다
            }

            var originalFetch = window.fetch;
            window.fetch = function (input, init) {
                show();
                return originalFetch.call(window, input, withCsrfHeader(input, init))
                    .then(function (res) {
                        return res.status === 401 ? redirectToLogin() : res;
                    })
                    .finally(hide);
            };
        })();
    </script>
</th:block>
