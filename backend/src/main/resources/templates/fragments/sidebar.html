<aside xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar" class="area-left">
    <style>
        .area-left{ padding:24px 18px; }

        .brand{ display:flex; align-items:center; gap:9px; margin-bottom:24px; }
        .brand .mark{
            width:28px; height:28px; border-radius:9px; background:var(--navy);
            display:grid; place-items:center; color:#fff; font-size:13px;
        }
        .brand .name{ font-size:13px; font-weight:700; }

        .nav{ display:flex; flex-direction:column; gap:6px; }
        .nav a{
            display:flex; align-items:center; gap:10px;
            padding:11px 14px; border-radius:var(--radius-md);
            font-size:12.5px; color:var(--text-sub); text-decoration:none;
        }
        .nav a .ico{ width:16px; text-align:center; }
        .nav a.is-active{ background:var(--accent); color:#fff; font-weight:700; }

        @media (max-width:760px){
            .nav{ flex-direction:row; flex-wrap:wrap; }
        }
    </style>

    <div class="brand">
        <span class="mark">▣</span>
        <span class="name">보안취약점 모니터링</span>
    </div>

    <nav class="nav">
        <a th:href="@{/}" th:classappend="${activeMenu == 'home'} ? 'is-active'"><span class="ico">▤</span>홈</a>
        <a th:href="@{/program/vulnerability-management}" th:classappend="${activeMenu == 'vulnerability-management'} ? 'is-active'"><span class="ico">⚠</span>취약점 관리</a>
        <a th:href="@{/program/vulnerability-search}" th:classappend="${activeMenu == 'vulnerability-search'} ? 'is-active'"><span class="ico">⌕</span>취약점 조회</a>
        <a th:href="@{/program/report}" th:classappend="${activeMenu == 'report'} ? 'is-active'"><span class="ico">▥</span>리포트</a>
        <a th:each="program : ${extraPrograms}" th:classappend="${activeMenu == program.programId} ? 'is-active'" th:href="@{${program.url}}">
            <span class="ico">▧</span><span th:text="${program.name}">프로그램</span>
        </a>
    </nav>
</aside>
