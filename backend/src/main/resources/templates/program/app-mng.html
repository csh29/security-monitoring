<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>앱 관리 · 보안취약점 모니터링 대시보드</title>
    <link rel="stylesheet" href="/css/common-ui.css">
    <link rel="stylesheet" href="/css/grid.css">
    <style>
        /* 화면 공통 뼈대(:root, .app-shell, .btn 등)는 common-ui.css가, .grid 공통 모양(패딩 포함)은
           grid.css가 담당한다. 이 화면은 기본값을 그대로 쓰므로 덮어쓸 규칙이 없다. */
    </style>
</head>
<body>
<div class="app-shell" th:classappend="${param.embed} ? 'app-shell--embedded'">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div th:replace="~{fragments/loading-overlay :: overlay}"></div>

    <main class="area-main">
        <section th:replace="~{fragments/page-toolbar :: toolbar}"></section>

        <section class="panel-head">
            <div class="panel-title">앱 목록</div>
        </section>

        <section>
            <table class="grid">
                <thead id="appGridHead"></thead>
                <tbody id="appGridBody"></tbody>
            </table>
        </section>
    </main>
</div>

<script src="/js/grid.js"></script>
<script src="/js/com-cd.js"></script>
<script th:inline="javascript">
    (function () {
        const API_URL = '/api/apps';
        const gridBody = document.getElementById('appGridBody');

        const COLUMNS = [
            { type: 'row-select', width: 36, align: 'center' },
            // Git: 저장소에서 받아 라이브러리 스캔·코드 점검. 소스 업로드: Git으로 접근할 수 없는 앱 — zip을 올려 코드 점검만 한다.
            { id: 'sourceType', label: '소스 출처', type: 'select', optionsQuery: 'APP_SOURCE', width: 120 },
            { id: 'repoUrl', label: 'Repository URL', type: 'text' },
            { id: 'branch', label: 'Branch', type: 'text' },
            { id: 'systemName', label: '시스템명', type: 'text' },
            { id: 'description', label: '설명', type: 'text' },
            { id: 'managerName', label: '담당자', type: 'text', width: 120 },
            { id: 'managerEmail', label: '담당자 이메일', type: 'text', width: 200 }
        ];

        Grid.renderHeader(document.getElementById('appGridHead'), COLUMNS);

        function renderRows(apps) {
            Grid.render(gridBody, COLUMNS, apps, { emptyMessage: '등록된 앱이 없습니다.' });
        }

        function searchApps() {
            fetch(API_URL)
                .then(function (res) {
                    if (!res.ok) throw new Error('조회에 실패했습니다.');
                    return res.json();
                })
                .then(renderRows)
                .catch(function (err) {
                    alert(err.message);
                });
        }

        function addRow() {
            Grid.addRow(gridBody);
        }

        function saveAll() {
            const requests = [];

            for (const row of Grid.getRows(gridBody)) {
                // 예전에 등록된 앱은 소스 출처가 비어 있다 — Git 앱이다(서버도 같은 기준).
                const sourceType = row.sourceType || 'GIT';
                const upload = sourceType === 'UPLOAD';
                const repoUrl = upload ? '' : row.repoUrl;
                const branch = upload ? '' : row.branch;
                const systemName = row.systemName;
                const description = row.description;
                const managerName = row.managerName;
                const managerEmail = row.managerEmail;

                if (!repoUrl && !branch && !systemName && !description && !managerName && !managerEmail) {
                    continue;
                }
                if (!systemName) {
                    alert('시스템명은 필수입니다.');
                    return;
                }
                if (!upload && (!repoUrl || !branch)) {
                    alert('Git 앱은 Repository URL과 Branch가 필수입니다(Git으로 접근할 수 없는 앱은 소스 출처를 "소스 업로드"로 두세요).');
                    return;
                }

                const payload = {
                    id: row._isNew ? null : row.id,
                    sourceType: sourceType,
                    repoUrl: repoUrl,
                    branch: branch,
                    systemName: systemName,
                    description: description,
                    managerName: managerName,
                    managerEmail: managerEmail
                };

                requests.push(fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }));
            }

            if (requests.length === 0) {
                return;
            }

            Promise.all(requests)
                .then(function (results) {
                    const failed = results.find(function (res) { return !res.ok; });
                    if (failed) {
                        // 저장소 URL·담당자 이메일 형식 오류는 서버가 400과 사유 문구로 돌려준다.
                        return failed.text().then(function (text) {
                            throw new Error(failed.status === 400 && text ? text : '저장에 실패했습니다.');
                        });
                    }
                    searchApps();
                })
                .catch(function (err) {
                    alert(err.message);
                });
        }

        function deleteSelected() {
            const rows = Grid.getRows(gridBody).filter(function (row) { return row._selected; });
            if (rows.length === 0) {
                alert('삭제할 앱을 목록에서 선택하세요.');
                return;
            }
            if (!confirm('선택한 앱을 삭제하시겠습니까?')) {
                return;
            }

            const requests = rows
                .filter(function (row) { return !row._isNew; })
                .map(function (row) { return fetch(API_URL + '/' + row.id, { method: 'DELETE' }); });

            // 저장 전 신규 행은 서버에 없으니 화면에서만 지운다.
            Grid.removeRows(gridBody, rows.filter(function (row) { return row._isNew; }));

            if (requests.length === 0) {
                return;
            }

            Promise.all(requests)
                .then(function (results) {
                    if (results.some(function (res) { return !res.ok; })) {
                        throw new Error('삭제에 실패했습니다.');
                    }
                    searchApps();
                })
                .catch(function (err) {
                    alert(err.message);
                });
        }

        PageButtons.bind({
            btnSearch: searchApps,
            btnAdd: addRow,
            btnSave: saveAll,
            btnDelete: deleteSelected,
            btnReset: searchApps
        });

        searchApps();
    })();
</script>
</body>
</html>
