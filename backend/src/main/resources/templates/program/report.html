<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>리포트 · 보안취약점 모니터링 대시보드</title>
    <style>
        :root{
            --bg:            #f2f2f8;
            --card:          #ffffff;
            --navy:          #191940;
            --accent:        #f43f68;
            --accent-soft:   #ffe4ec;
            --text:          #191940;
            --text-sub:      #8b8ba7;
            --line:          #e8e8f2;

            --radius-md: 14px;

            --left-w:  220px;
            --top-h:   64px;
        }

        *{ box-sizing:border-box; margin:0; padding:0; }
        html, body{ height:100%; }
        body{
            font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;
            background:var(--bg); color:var(--text);
        }

        .app-shell{
            width:100%; height:100vh;
            display:grid;
            grid-template-columns: var(--left-w) 1fr;
            grid-template-rows:    var(--top-h)  1fr;
            grid-template-areas:
                "left top"
                "left main";
        }

        .area-left{ grid-area:left; background:var(--card); border-right:1px solid var(--line); overflow-y:auto; }
        .area-top { grid-area:top;  background:var(--card); border-bottom:1px solid var(--line); }
        .area-main{ grid-area:main; overflow-y:auto; }

        @media (max-width:760px){
            .app-shell{
                grid-template-columns:1fr;
                grid-template-rows:auto auto 1fr;
                grid-template-areas:"left" "top" "main";
                height:auto; min-height:100vh;
            }
        }

        .area-main{ padding:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
        .placeholder-title{ font-size:16px; font-weight:800; color:var(--text); }
        .placeholder-desc{ font-size:13px; color:var(--text-sub); }
    </style>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div th:replace="~{fragments/loading-overlay :: overlay}"></div>

    <main class="area-main">
        <div class="placeholder-title">리포트</div>
        <div class="placeholder-desc">해당 기능은 준비 중입니다.</div>
    </main>
</div>
</body>
</html>
