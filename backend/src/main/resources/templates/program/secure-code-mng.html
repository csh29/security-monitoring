<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>코드 점검 결과 · 보안취약점 모니터링 대시보드</title>
    <link rel="stylesheet" href="/css/common-ui.css">
    <link rel="stylesheet" href="/css/grid.css">
    <style>
        /* 화면 공통 뼈대·뱃지·모달·상세 표·코드 블록은 common-ui.css, .grid는 grid.css. 여기는 이 화면에서만 다른 값만.
           그리드가 남는 높이를 채우는 배치는 취약점 관리 화면과 같다. */
        .area-main{ overflow:hidden; }
        .grid-section{ flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; }
        .grid-wrap{ flex:1; min-height:0; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-box); }
        .grid{ table-layout:fixed; border:none; border-radius:0; overflow:visible; }
        .grid td{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .grid .empty{ white-space:normal; }

        /* 제목 옆 "총 N건" — 항목별 건수는 필요할 때만 본다. 예전엔 제목 아래 한 줄에 모든 항목을 나열해 항목이 많으면 여러 줄로 꺾여 난잡했다.
           링크처럼 밑줄·손 모양 커서를 두고, 마우스를 올리거나(키보드로 초점이 가면) 아래로 항목별 건수 목록을 띄운다. */
        .count-anchor{ position:relative; display:inline-block; margin-left:8px; font-size:12px; font-weight:400; }
        .count-link{ color:var(--text); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
        .count-link:hover, .count-link:focus{ color:var(--accent); outline:none; }
        /* 바깥 상자의 padding-top은 투명한 다리 — 숫자에서 목록으로 마우스를 옮기는 사이 틈에서 목록이 닫히지 않게 한다. */
        .count-popover{ display:none; position:absolute; top:100%; left:0; z-index:20; padding-top:6px; }
        .count-anchor:hover .count-popover, .count-anchor:focus-within .count-popover{ display:block; }
        /* 목록은 공통 그리드(.grid)라 배경·헤더·행 높이·선이 탐지 그리드와 같다. 상자는 위 .grid-wrap 규칙(흰 배경·테두리·세로 스크롤)을 그대로 쓰고
           크기와 그림자만 준다 — 그리드 위에 떠 있는 게 보이게. */
        /* 폭 = 컬럼 합(250+70) + 세로 스크롤바·테두리 여유. 300px에서는 스크롤바 폭만큼 모자라 가로 스크롤이 생겼다 — 가로는 아예 막는다. */
        .count-popover-box{ display:block; width:360px; max-height:320px; overflow-x:hidden; box-shadow:0 8px 24px rgba(25,25,64,.18); }

        /* 코드 조각은 길어서 기본 모달 폭(560px)으로는 줄이 다 꺾이고, 메서드 단위 조각·근거 코드를 펼치면 기본 높이(70vh)로는 스크롤이 잦다. */
        .finding-modal{ max-width:960px; max-height:90vh; }
        .finding-modal .detail-list{ grid-template-columns:110px 1fr; margin-bottom:12px; }
        /* 조각은 걸린 줄을 감싼 메서드(최대 80줄)라 높이를 묶고, 열 때 걸린 줄이 보이게 스크롤한다(position은 그 계산 기준). */
        #findingModalCode{ position:relative; max-height:420px; overflow:auto; }
        /* 연계 추적 근거 — 값이 지나온 길을 위에서 아래로. 한 걸음이 길어 줄을 꺾는다. */
        .trace-steps{ margin:6px 0 0; padding-left:20px; font-size:12px; line-height:1.6; color:var(--text-sub); white-space:normal; }
        .trace-steps li{ word-break:break-all; }
        /* 코드가 붙은 걸음은 눌러서 그 줄 주변 코드를 펼친다(점검 때 저장해 둔 앞뒤 3줄). */
        .trace-step-link{ color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; cursor:pointer; }
        .trace-step-link:hover, .trace-step-link:focus{ text-decoration-style:solid; outline:none; }
        .trace-steps .code-block{ margin:4px 0 8px; }
        .trace-hint{ margin-top:4px; font-size:11px; color:var(--text-sub); }
        /* AI 판별 이유 — 몇 문장짜리 설명이라 줄을 꺾는다. */
        .ai-reasoning{ margin:6px 0 0; font-size:12px; line-height:1.6; white-space:pre-wrap; word-break:break-all; }
        .ai-note{ margin-top:4px; font-size:11px; color:var(--text-sub); }
    </style>
</head>
<body>
<div class="app-shell" th:classappend="${param.embed} ? 'app-shell--embedded'">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div th:replace="~{fragments/loading-overlay :: overlay}"></div>

    <main class="area-main">
        <section th:replace="~{fragments/page-toolbar :: toolbar}"></section>

        <section class="search-row" id="searchArea"></section>

        <section class="grid-section">
            <div class="panel-title">탐지 목록
                <div class="count-anchor">
                    <span class="count-link" id="findingCount" tabindex="0" aria-describedby="findingCountDetail">총 0건</span>
                    <!-- 부모를 .grid-wrap으로 두면 grid.js가 스크롤 감싸기·높이 계산을 하지 않는다 — 숨겨진 목록에서 높이가 0으로 잡히지 않게. -->
                    <div class="count-popover">
                        <div class="count-popover-box grid-wrap" id="findingCountDetail" role="tooltip">
                            <table class="grid">
                                <thead id="findingCountHead"></thead>
                                <tbody id="findingCountBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="grid-wrap">
                <table class="grid">
                    <thead id="findingGridHead"></thead>
                    <tbody id="findingGridBody"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<div class="modal-backdrop" id="findingModalBackdrop">
    <div class="modal finding-modal">
        <h3 id="findingModalTitle">상세보기</h3>
        <dl class="detail-list">
            <dt>항목</dt><dd id="findingModalKisa"></dd>
            <dt>CWE</dt><dd><a id="findingModalCwe" target="_blank" rel="noopener noreferrer"></a></dd>
            <dt>규칙</dt><dd id="findingModalRule"></dd>
            <dt>위치</dt><dd id="findingModalLocation"></dd>
            <dt>설명·조치</dt><dd id="findingModalMessage"></dd>
            <dt id="findingModalTraceTerm">연계 추적</dt><dd id="findingModalTrace"></dd>
            <dt id="findingModalAiTerm">AI 판별</dt><dd id="findingModalAi"></dd>
            <dt>탐지 일시</dt><dd id="findingModalDetected"></dd>
        </dl>
        <pre class="code-block" id="findingModalCode"></pre>
        <div class="modal-actions">
            <button type="button" class="btn" id="findingModalCopy">위치 복사</button>
            <button type="button" class="btn" id="findingModalClose">닫기</button>
        </div>
    </div>
</div>

<script src="/js/grid.js"></script>
<script src="/js/com-cd.js"></script>
<script src="/js/search-form.js"></script>
<script src="/js/code-highlight.js"></script>
<script th:inline="javascript">
    (function () {
        const API_URL = '/api/secure-code/findings';
        // 조각(메서드 단위)·연계 추적 코드는 목록에 넣지 않고 상세보기를 열 때 한 건씩 받는다.
        const CODE_URL = function (id) { return '/api/secure-code/findings/' + encodeURIComponent(id) + '/code'; };
        const STATUS_URL = '/api/secure-code/findings/status';
        const APPS_URL = '/api/apps';
        const CWE_URL = 'https://cwe.mitre.org/data/definitions/';
        const gridBody = document.getElementById('findingGridBody');
        const modalBackdrop = document.getElementById('findingModalBackdrop');

        // 조회해 온 시점의 처리여부·비고(id -> { status, remark }). 저장할 때 바뀐 행만 골라 보내는 기준이다
        // — 행 데이터는 입력 셀의 현재 값으로 덮인다(Grid.getRows). 취약점 관리 화면과 같은 방식.
        let loaded = {};
        let currentRow = null;

        function badge(text, cssClass) {
            const span = document.createElement('span');
            span.className = 'badge ' + cssClass;
            span.textContent = text;
            return span;
        }

        function formatDateTime(value) {
            return value ? String(value).replace('T', ' ').substring(0, 19) : '';
        }

        function location(row) {
            return row.filePath + ':' + row.startLine;
        }

        function fileName(path) {
            return (path || '').split('/').pop();
        }

        /**
         * 코드 조각을 줄 번호와 함께 그린다. 걸린 줄(startLine~endLine)은 강조하고, 파일 종류(확장자)에 맞춰 구문 색을 넣는다(code-highlight.js).
         * 코드는 토큰마다 textContent로 넣는다 — 조각 안의 HTML·스크립트가 실행되지 않게 innerHTML을 쓰지 않는다.
         * code: { snippet, snippetStartLine, filePath, startLine, endLine } — 탐지 조각과 연계 추적 걸음 코드가 같이 쓴다.
         */
        function renderCode(pre, row) {
            pre.replaceChildren();
            if (!row.snippet) {
                pre.textContent = '(코드 조각 없음)';
                return;
            }
            // 이름을 누르면 같은 이름을 모두 칠한다(IntelliJ처럼) — 값이 어디서 와서 어디로 가는지 눈으로 따라가기 쉽게.
            CodeHighlight.enableUsages(pre);
            CodeHighlight.lines(row.snippet, CodeHighlight.languageOf(row.filePath)).forEach(function (tokens, i) {
                const no = (row.snippetStartLine || 1) + i;
                const line = document.createElement('span');
                line.className = 'code-line' + (no >= row.startLine && no <= row.endLine ? ' hit' : '');
                const num = document.createElement('span');
                num.className = 'code-no';
                num.textContent = no;
                const code = document.createElement('span');
                code.className = 'code-text';
                tokens.forEach(function (token) {
                    if (!token.type) {
                        code.appendChild(document.createTextNode(token.text));
                        return;
                    }
                    const span = document.createElement('span');
                    span.className = 'tok-' + token.type;
                    span.textContent = token.text;
                    code.appendChild(span);
                });
                // 빈 줄도 높이를 갖도록(줄 강조가 끊기지 않게) 비었으면 공백 하나를 넣는다.
                if (!tokens.length) code.textContent = ' ';
                line.appendChild(num);
                line.appendChild(code);
                pre.appendChild(line);
            });
        }

        /**
         * MyBatis ${} 연계 추적 판정 → 뱃지 색. 클라이언트 값·공통 경로 우회는 실제로 공격 가능해 high,
         * 판정 불가는 사람 검토라 medium, 나머지(세션 덮어쓰기·서버 세팅·XML 결정)는 low. 등급 매김(DollarTraceMerger)과 같은 기준.
         */
        const TRACE_BADGE = { CLIENT: 'high', BYPASSABLE: 'high', UNKNOWN: 'medium' };

        /**
         * 판정 뱃지. withTarget이면 매퍼 판정의 대상 식을 붙인다("서버가 세팅 · ${loginBrndzCd}") — 상세 모달용. 한 줄에 ${}가 여럿이면 탐지도 여럿인데
         * 위치·항목이 같아 어느 행이 어느 값의 판정인지 구분되지 않았다. 그리드 열은 판정만 보이고 대상 식은 마우스를 올리면(툴팁) 보인다.
         */
        function traceBadge(row, withTarget) {
            if (!row.traceSafety) return '';
            const label = (row.traceLabel || row.traceSafety) + (withTarget && row.traceTarget ? ' · ' + row.traceTarget : '');
            return badge(label, TRACE_BADGE[row.traceSafety] || 'low');
        }

        /**
         * 연계 추적이 없는 탐지(${} 규칙이 아니거나 추적 못 함)는 그 줄을 숨긴다. 근거는 한 걸음씩 textContent로.
         * traceCode(근거와 같은 순서, 없으면 null)가 있는 걸음은 눌러서 그 줄 주변 코드를 펼친다 — 근거는 다른 파일·메서드를 가리켜
         * 아래 조각(걸린 줄을 감싼 메서드)에 안 보이는 경우가 많다.
         */
        function renderTrace(row, traceCode) {
            const term = document.getElementById('findingModalTraceTerm');
            const dd = document.getElementById('findingModalTrace');
            dd.replaceChildren();
            const has = !!row.traceSafety;
            term.style.display = has ? '' : 'none';
            dd.style.display = has ? '' : 'none';
            if (!has) return;
            dd.appendChild(traceBadge(row, true));
            const steps = document.createElement('ol');
            steps.className = 'trace-steps';
            let linked = 0;
            (row.traceEvidence || []).forEach(function (step, i) {
                const li = document.createElement('li');
                const code = traceCode && traceCode[i];
                if (!code) {
                    li.textContent = step;
                    steps.appendChild(li);
                    return;
                }
                linked++;
                const text = document.createElement('span');
                text.className = 'trace-step-link';
                text.textContent = step;
                text.tabIndex = 0;
                text.title = code.path + ':' + code.line;
                let pre = null;
                const toggle = function () {
                    if (pre) {
                        pre.remove();
                        pre = null;
                        return;
                    }
                    pre = document.createElement('pre');
                    pre.className = 'code-block';
                    renderCode(pre, { snippet: code.code, snippetStartLine: code.startLine, filePath: code.path,
                        startLine: code.line, endLine: code.line });
                    li.appendChild(pre);
                };
                text.addEventListener('click', toggle);
                text.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        toggle();
                    }
                });
                li.appendChild(text);
                steps.appendChild(li);
            });
            dd.appendChild(steps);
            if (linked > 0) {
                const hint = document.createElement('div');
                hint.className = 'trace-hint';
                hint.textContent = '밑줄 친 걸음을 누르면 그 줄 주변 코드를 펼칩니다(점검 시점 코드).';
                dd.appendChild(hint);
            }
        }

        /**
         * AI 판별(코드 점검 stage 5) → 표시. 결정론으로 못 정한 높은 등급만 대상이라, 대상이 아니면 빈칸이다.
         * 색은 조치안 화면과 같은 기준 — 빨강/노랑은 사람이 봐야 함, 파랑은 배치가 알아서 처리함. 오탐 의심은 회색(처리여부 "오탐"과 같은 색)이지만
         * 처리여부를 바꾸지는 않는다 — 사람이 코드를 보고 정한다.
         */
        const AI_VERDICTS = {
            VULNERABLE: { label: '취약 (AI)', css: 'high' },
            UNCERTAIN: { label: '확인 필요 (AI)', css: 'needs_check' },
            NOT_VULNERABLE: { label: '오탐 의심 (AI)', css: 'false_positive' },
            PENDING: { label: '판별 대기', css: 'pending' }
        };
        const CONFIDENCE_LABELS = { high: '높음', medium: '보통', low: '낮음' };

        function aiBadge(row) {
            const v = AI_VERDICTS[row.aiVerdict];
            return v ? badge(v.label, v.css) : '';
        }

        /** AI 판별이 없는 탐지(대상 아님)는 그 줄을 숨긴다. 이유는 AI가 쓴 문장이라 textContent로만 넣는다. */
        function renderAi(row) {
            const term = document.getElementById('findingModalAiTerm');
            const dd = document.getElementById('findingModalAi');
            dd.replaceChildren();
            const has = !!AI_VERDICTS[row.aiVerdict];
            term.style.display = has ? '' : 'none';
            dd.style.display = has ? '' : 'none';
            if (!has) return;
            dd.appendChild(aiBadge(row));
            if (row.aiVerdict === 'PENDING') {
                // 판별에 쓸 코드 문맥(메서드)은 점검 때 만들어 둔다 — 대상 기준이 넓어진 직후의 탐지는 다음 점검 뒤에 판별된다.
                dd.appendChild(document.createTextNode(' 다음 AI 배치에서 판별합니다(코드 문맥이 아직 없으면 다음 코드 점검 뒤).'));
                return;
            }
            dd.appendChild(document.createTextNode(' 신뢰도 ' + (CONFIDENCE_LABELS[row.aiConfidence] || row.aiConfidence || '-')
                + ' · ' + formatDateTime(row.aiReviewedAt)));
            const reasoning = document.createElement('div');
            reasoning.className = 'ai-reasoning';
            reasoning.textContent = row.aiReasoning || '';
            dd.appendChild(reasoning);
            const note = document.createElement('div');
            note.className = 'ai-note';
            note.textContent = '탐지 줄을 감싼 메서드만 보고 낸 참고 의견입니다. 처리여부는 코드를 확인한 뒤 직접 정하세요.';
            dd.appendChild(note);
        }

        function openModal(row) {
            currentRow = row;
            document.getElementById('findingModalTitle').textContent = '상세보기 · ' + row.systemName;
            document.getElementById('findingModalKisa').textContent =
                (row.kisaCategory ? row.kisaCategory + ' / ' : '') + (row.kisaName || '-');
            const cwe = document.getElementById('findingModalCwe');
            const cweNo = (row.cwe || '').replace(/^CWE-/, '');
            // 링크는 숫자 CWE일 때만 만든다(규칙 메타데이터 값을 그대로 URL에 넣지 않는다).
            if (/^\d+$/.test(cweNo)) {
                cwe.href = CWE_URL + cweNo + '.html';
                cwe.textContent = row.cwe;
            } else {
                cwe.removeAttribute('href');
                cwe.textContent = row.cwe || '-';
            }
            document.getElementById('findingModalRule').textContent = row.ruleId;
            document.getElementById('findingModalLocation').textContent =
                row.filePath + ' (' + row.startLine + (row.endLine !== row.startLine ? '~' + row.endLine : '') + '줄)';
            document.getElementById('findingModalMessage').textContent = row.message || '-';
            renderTrace(row, null);
            renderAi(row);
            document.getElementById('findingModalDetected').textContent =
                '최초 ' + formatDateTime(row.firstDetectedAt) + ' / 최근 ' + formatDateTime(row.lastDetectedAt);
            const pre = document.getElementById('findingModalCode');
            pre.replaceChildren();
            pre.textContent = '코드를 불러오는 중…';
            modalBackdrop.classList.add('open');
            fetch(CODE_URL(row.id))
                .then(function (res) {
                    if (!res.ok) throw new Error('코드를 불러오지 못했습니다.');
                    return res.json();
                })
                .then(function (code) {
                    // 그사이 다른 행을 열었으면 버린다.
                    if (currentRow !== row) return;
                    renderCode(pre, code);
                    const hit = pre.querySelector('.code-line.hit');
                    if (hit) pre.scrollTop = Math.max(0, hit.offsetTop - pre.clientHeight / 3);
                    renderTrace(row, code.traceCode);
                })
                .catch(function (err) {
                    if (currentRow === row) pre.textContent = '(' + err.message + ')';
                });
        }

        function closeModal() {
            modalBackdrop.classList.remove('open');
        }

        document.getElementById('findingModalClose').addEventListener('click', closeModal);
        document.getElementById('findingModalCopy').addEventListener('click', function () {
            if (currentRow) Grid.copyText(location(currentRow));
        });
        modalBackdrop.addEventListener('click', function (e) {
            if (e.target === modalBackdrop) closeModal();
        });

        const COLUMNS = [
            { id: 'systemName', label: '시스템명', width: 110, title: true },
            { id: 'kisaName', label: '항목', width: 150, title: true },
            {
                id: 'severity', label: '심각도', width: 90, align: 'center',
                render: function (value) { return value ? badge(value, value.toLowerCase()) : ''; }
            },
            // 값이 어디서 오는지 Java 소스를 따라가 본 판정(MyBatis ${}·사용자 범위 #{}·위험 호출 지점). 심각도는 이 판정으로 다시 매긴 값이다.
            // 열에는 판정만 보이고, 대상 식과 근거는 툴팁으로 본다.
            {
                id: 'traceLabel', label: '연계 판정', width: 150, align: 'center',
                render: function (value, row) { return traceBadge(row, false); },
                title: function (value, row) {
                    return (row.traceTarget ? '대상: ' + row.traceTarget + '\n' : '') + (row.traceEvidence || []).join('\n');
                }
            },
            // 결정론(연계 추적)으로 못 정한 높은 등급만 AI가 코드를 보고 판별한다. 참고용 — 처리여부는 바꾸지 않는다.
            {
                id: 'aiVerdict', label: 'AI 판별', width: 120, align: 'center',
                render: function (value, row) { return aiBadge(row); },
                title: function (value, row) { return row.aiReasoning || ''; }
            },
            // 오탐·위험수용·조치완료로 저장한 건은 같은 코드가 다시 탐지돼도 유지된다(코드가 바뀌면 새 건이 된다).
            {
                id: 'status', label: '처리여부', width: 90, align: 'center', type: 'select', optionsQuery: 'SC_STATUS',
                display: function (value, label) { return badge(label || value || '', (value || '').toLowerCase()); }
            },
            { id: 'statusChangedBy', label: '처리자', width: 80, align: 'center' },
            { id: 'remark', label: '비고', width: 200, type: 'text' },
            // 경로까지 보이면 열이 너무 넓어져 파일명만 보인다. 전체 경로·줄은 마우스를 올리거나 상세보기에서 본다.
            {
                id: 'location', label: '파일', width: 180,
                render: function (value, row) { return fileName(row.filePath); },
                title: function (value, row) { return location(row); }
            },
            // 규칙 id(kisa-...)는 내부 식별자라 그리드에 두지 않는다 — 무슨 약점인지는 항목·CWE가 보여주고, 규칙 id는 상세보기에 있다.
            { id: 'cwe', label: 'CWE', width: 80, align: 'center' },
            { id: 'firstDetectedAt', label: '최초 탐지', width: 130, align: 'center', render: formatDateTime },
            {
                label: '상세보기', width: 80, align: 'center',
                render: function (value, row) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'btn grid-btn';
                    btn.textContent = '상세보기';
                    btn.addEventListener('click', function () { openModal(row); });
                    return btn;
                }
            }
        ];

        Grid.renderHeader(document.getElementById('findingGridHead'), COLUMNS);

        function loadAppOptions() {
            return fetch(APPS_URL)
                .then(function (res) {
                    if (!res.ok) throw new Error('APP 목록 조회에 실패했습니다.');
                    return res.json();
                })
                .then(function (apps) {
                    return (apps || []).map(function (app) { return { value: app.id, label: app.systemName }; });
                })
                .catch(function (err) {
                    alert(err.message);
                    return [];
                });
        }

        // APP·처리여부는 서버에서, 심각도(여러 값)·CWE·파일은 받은 목록을 화면에서 거른다(search.matches).
        const search = SearchForm.render(document.getElementById('searchArea'), [
            { id: 'appId', label: 'APP', type: 'select', withAll: true, options: loadAppOptions },
            { id: 'status', label: '처리여부', type: 'select', withAll: true, optionsQuery: 'SC_STATUS', defaultValue: 'OPEN', width: 100 },
            // 코드 점검 등급에는 CRITICAL이 없어 라이브러리용 SEVERITY가 아니라 SC_SEVERITY(HIGH/MEDIUM/LOW)를 쓴다.
            // HIGH+MEDIUM처럼 여러 등급을 같이 보는 일이 많아 여러 값 고르기(안 고르면 전체). 거르기는 search.matches가 한다.
            { id: 'severity', label: '심각도', type: 'multiselect', optionsQuery: 'SC_SEVERITY', width: 100 },
            // 번호만("89")·접두어 포함("CWE-89") 모두 받고, 쉼표로 여러 개를 준다. 부분 일치면 89가 CWE-189까지 걸려 번호로 정확히 비교한다.
            { id: 'cwe', label: 'CWE', type: 'text', width: 110, placeholder: '예: 89, 79', match: matchesCwe },
            { id: 'filePath', label: '파일', type: 'text', width: 180 }
        ], { onSearch: searchFindings });

        function cweNumber(text) {
            const m = /(\d+)/.exec(text || '');
            return m ? String(Number(m[1])) : null;
        }

        function matchesCwe(value, keyword) {
            const target = cweNumber(value);
            const wanted = keyword.split(',').map(cweNumber).filter(function (n) { return n; });
            return wanted.length === 0 || wanted.indexOf(target) >= 0;
        }

        // 제목 옆 "총 N건"에 마우스를 올리면 뜨는 항목별 건수 — 탐지 그리드와 같은 공통 그리드로 그린다.
        const COUNT_COLUMNS = [
            { id: 'kisaName', label: '항목', width: 250, title: true },
            { id: 'count', label: '건수', width: 70, align: 'right', render: function (value) { return value + '건'; } }
        ];
        const countBody = document.getElementById('findingCountBody');
        Grid.renderHeader(document.getElementById('findingCountHead'), COUNT_COLUMNS);

        /** 총 건수와 항목별 건수(많은 순) — 화면에 보이는 행 기준. */
        function renderSummary(rows) {
            const counts = {};
            rows.forEach(function (row) {
                const key = row.kisaName || '(항목 없음)';
                counts[key] = (counts[key] || 0) + 1;
            });
            document.getElementById('findingCount').textContent = '총 ' + rows.length + '건';
            const items = Object.keys(counts)
                .sort(function (a, b) { return counts[b] - counts[a]; })
                .map(function (key) { return { kisaName: key, count: counts[key] }; });
            Grid.render(countBody, COUNT_COLUMNS, items, { emptyMessage: '탐지된 항목이 없습니다.' });
        }

        function renderRows(findings) {
            const rows = (findings || []).filter(search.matches);
            loaded = {};
            rows.forEach(function (f) { loaded[f.id] = { status: f.status, remark: f.remark || '' }; });
            renderSummary(rows);
            // 탐지가 수백 건이면 전부 붙인 표는 탭을 다시 열 때 버벅인다 — 보이는 행만 붙인다(셀이 줄바꿈되지 않아 행 높이가 일정하다).
            Grid.render(gridBody, COLUMNS, rows, { emptyMessage: '탐지된 항목이 없습니다.', virtual: true });
        }

        function searchFindings() {
            const params = new URLSearchParams();
            const cond = search.values();
            if (cond.appId) params.set('appId', cond.appId);
            // "전체"(빈 값)도 명시적으로 보내야 서버 기본값(OPEN)이 적용되지 않는다.
            params.set('status', cond.status);

            fetch(API_URL + '?' + params.toString())
                .then(function (res) {
                    if (!res.ok) throw new Error('탐지 목록 조회에 실패했습니다.');
                    return res.json();
                })
                .then(renderRows)
                .catch(function (err) {
                    Grid.renderMessage(gridBody, COLUMNS.length, err.message);
                });
        }

        /** 처리여부나 비고를 바꾼 행만 저장한다(서버도 실제로 달라진 항목만 반영한다). */
        function saveStatuses() {
            const changed = Grid.getRows(gridBody)
                .filter(function (row) {
                    const before = loaded[row.id] || {};
                    return row.status !== before.status || (row.remark || '') !== before.remark;
                })
                .map(function (row) { return { id: row.id, status: row.status, remark: row.remark }; });

            if (changed.length === 0) {
                alert('변경된 처리여부·비고가 없습니다.');
                return;
            }
            if (!confirm(changed.length + '건을 저장하시겠습니까?\n' +
                    '오탐·위험수용·조치완료로 저장한 건은 같은 코드가 다시 탐지돼도 유지됩니다(코드가 바뀌면 새 건으로 다시 잡힙니다).')) {
                return;
            }

            fetch(STATUS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(changed)
            })
                .then(function (res) {
                    if (!res.ok) {
                        return res.text().then(function (text) { throw new Error(text || '저장에 실패했습니다.'); });
                    }
                    searchFindings();
                })
                .catch(function (err) {
                    alert(err.message);
                });
        }

        PageButtons.bind({
            btnSearch: searchFindings,
            btnSave: saveStatuses
        });

        search.ready
            .catch(function (err) { alert(err.message); })
            .then(searchFindings);
    })();
</script>
</body>
</html>
