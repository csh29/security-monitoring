<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>사용자 관리 · 보안취약점 모니터링 대시보드</title>
    <link rel="stylesheet" href="/css/common-ui.css">
    <link rel="stylesheet" href="/css/grid.css">
    <style>
        /* 화면 공통 뼈대(:root, .app-shell, .btn 등)는 common-ui.css가, .grid 공통 모양(패딩 포함)은
           grid.css가 담당한다. 여기는 이 화면에서만 다른 값(역할 select 폭)만 남긴다. */
        .grid td select{ width:110px; }
    </style>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div th:replace="~{fragments/loading-overlay :: overlay}"></div>

    <main class="area-main">
        <section class="panel-head">
            <div class="panel-title">사용자 목록</div>
            <div class="btn-group">
                <button type="button" id="btnSearch" class="btn">조회</button>
                <button type="button" id="btnAdd" class="btn">추가</button>
                <button type="button" id="btnSave" class="btn primary">저장</button>
                <button type="button" id="btnDelete" class="btn danger">삭제</button>
                <button type="button" id="btnReset" class="btn">초기화</button>
            </div>
        </section>

        <section>
            <table class="grid" id="userGrid">
                <thead id="userGridHead"></thead>
                <tbody id="userGridBody">
                    <tr><td class="empty" colspan="4">조회 중입니다...</td></tr>
                </tbody>
            </table>
        </section>
    </main>
</div>

<script src="/js/grid.js"></script>
<script src="/js/common-code.js"></script>
<script th:inline="javascript">
    (function () {
        const API_URL = '/api/users';
        const gridBody = document.getElementById('userGridBody');

        // 역할 select 옵션은 공통코드관리 화면(그룹 "ROLE")에서 관리한다. fetchCodes로 한 번만
        // 받아 캐시된 배열을 COLUMNS의 select 컬럼(options)이 그대로 재사용한다.
        let roleCodes = [];

        function initRow(tr, user) {
            tr._fields = {};
            if (user && user.id) {
                tr.dataset.id = user.id;
            }
        }

        const COLUMNS = [
            { type: 'row-select', width: 36, align: 'center' },
            { id: 'username', label: '아이디', type: 'text' },
            {
                id: 'password', label: '비밀번호', type: 'password',
                placeholder: function (user) { return (user && user.id) ? '변경 시에만 입력' : '필수 입력'; }
            },
            {
                id: 'role', label: '역할', type: 'select',
                options: function () {
                    return roleCodes.map(function (code) { return { value: code.codeValue, label: code.codeName }; });
                },
                defaultValue: 'USER'
            }
        ];

        Grid.renderHeader(document.getElementById('userGridHead'), COLUMNS);

        function buildRow(user) {
            return Grid.buildRow(COLUMNS, user, { buildRow: initRow });
        }

        function renderRows(users) {
            Grid.render(gridBody, COLUMNS, users, { emptyMessage: '등록된 사용자가 없습니다.', buildRow: initRow });
        }

        function searchUsers() {
            fetch(API_URL)
                .then(function (res) {
                    if (!res.ok) throw new Error('조회에 실패했습니다.');
                    return res.json();
                })
                .then(renderRows)
                .catch(function (err) {
                    alert(err.message);
                });
        }

        function addRow() {
            const emptyRow = gridBody.querySelector('.empty');
            if (emptyRow) {
                emptyRow.closest('tr').remove();
            }
            const tr = buildRow(null);
            gridBody.insertBefore(tr, gridBody.firstChild);
            tr._fields.username.focus();
        }

        function saveAll() {
            const rows = Array.from(gridBody.querySelectorAll('tr')).filter(function (tr) {
                return !!tr._fields;
            });
            const requests = [];

            for (const tr of rows) {
                const username = tr._fields.username.value.trim();
                const password = tr._fields.password.value.trim();
                const role = tr._fields.role.value;
                const isExisting = !!tr.dataset.id;

                if (!username && !password) {
                    continue;
                }
                if (!username) {
                    alert('아이디는 필수입니다.');
                    return;
                }
                if (!isExisting && !password) {
                    alert('신규 사용자는 비밀번호가 필수입니다.');
                    return;
                }

                const payload = {
                    id: isExisting ? Number(tr.dataset.id) : null,
                    username: username,
                    password: password,
                    role: role
                };

                requests.push(fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }));
            }

            if (requests.length === 0) {
                return;
            }

            Promise.all(requests)
                .then(function (results) {
                    if (results.some(function (res) { return !res.ok; })) {
                        throw new Error('저장에 실패했습니다.');
                    }
                    searchUsers();
                })
                .catch(function (err) {
                    alert(err.message);
                });
        }

        function deleteSelected() {
            const rows = Array.from(gridBody.querySelectorAll('tr.selected'));
            if (rows.length === 0) {
                alert('삭제할 사용자를 목록에서 선택하세요.');
                return;
            }
            if (!confirm('선택한 사용자를 삭제하시겠습니까?')) {
                return;
            }

            const requests = rows
                .filter(function (tr) { return !!tr.dataset.id; })
                .map(function (tr) { return fetch(API_URL + '/' + tr.dataset.id, { method: 'DELETE' }); });

            rows.forEach(function (tr) {
                if (!tr.dataset.id) {
                    tr.remove();
                }
            });

            if (requests.length === 0) {
                return;
            }

            Promise.all(requests)
                .then(function (results) {
                    if (results.some(function (res) { return !res.ok; })) {
                        throw new Error('삭제에 실패했습니다.');
                    }
                    searchUsers();
                })
                .catch(function (err) {
                    alert(err.message);
                });
        }

        document.getElementById('btnSearch').addEventListener('click', searchUsers);
        document.getElementById('btnAdd').addEventListener('click', addRow);
        document.getElementById('btnSave').addEventListener('click', saveAll);
        document.getElementById('btnDelete').addEventListener('click', deleteSelected);
        document.getElementById('btnReset').addEventListener('click', searchUsers);

        CommonCode.fetchCodes('ROLE')
            .then(function (codes) {
                roleCodes = codes;
                searchUsers();
            })
            .catch(function (err) {
                alert(err.message);
            });
    })();
</script>
</body>
</html>
