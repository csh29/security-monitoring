<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>사용자 관리 · 보안취약점 모니터링 대시보드</title>
    <link rel="stylesheet" href="/css/common-ui.css">
    <link rel="stylesheet" href="/css/grid.css">
    <style>
        /* 화면 공통 뼈대(:root, .app-shell, .btn 등)는 common-ui.css가, .grid 공통 모양(패딩 포함)은
           grid.css가 담당한다. 여기는 이 화면에서만 다른 값(역할 select 폭)만 남긴다. */
        .grid td select{ width:110px; }
    </style>
</head>
<body>
<div class="app-shell" th:classappend="${param.embed} ? 'app-shell--embedded'">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div th:replace="~{fragments/loading-overlay :: overlay}"></div>

    <main class="area-main">
        <section th:replace="~{fragments/page-toolbar :: toolbar}"></section>

        <section class="search-row" id="searchArea"></section>

        <section class="panel-head">
            <div class="panel-title">사용자 목록</div>
        </section>

        <section>
            <table class="grid">
                <thead id="userGridHead"></thead>
                <tbody id="userGridBody"></tbody>
            </table>
        </section>
    </main>
</div>

<script src="/js/grid.js"></script>
<script src="/js/search-form.js"></script>
<script src="/js/common-code.js"></script>
<script th:inline="javascript">
    (function () {
        const API_URL = '/api/users';
        const gridBody = document.getElementById('userGridBody');

        const COLUMNS = [
            { type: 'row-select', width: 36, align: 'center' },
            { id: 'username', label: '아이디', type: 'text' },
            { id: 'userNm', label: '사용자명', type: 'text' },
            {
                id: 'password', label: '비밀번호', type: 'password',
                placeholder: function (user) { return (user && user.id) ? '변경 시에만 입력' : '필수 입력'; }
            },
            {
                // 역할 select 옵션은 공통코드관리 화면(그룹 "ROLE")에서 관리한다. 화면이 직접
                // 조회하지 않고, optionsQuery만 주면 render()가 공통코드에서 채워온다.
                id: 'role', label: '역할', type: 'select', optionsQuery: 'ROLE', defaultValue: 'USER'
            }
        ];

        Grid.renderHeader(document.getElementById('userGridHead'), COLUMNS);

        const search = SearchForm.render(document.getElementById('searchArea'), [
            { id: 'username', label: '아이디', type: 'text' },
            { id: 'userNm', label: '사용자명', type: 'text' }
        ], { onSearch: searchUsers });

        // 조회조건은 화면에서 거른다 — /api/users는 사용자별 권한관리 화면도 전체 목록으로 쓰므로
        // API는 그대로 둔다(프로그램 관리 화면과 같은 방식). 대소문자 구분 없는 부분 일치.
        function matchesCondition(user) {
            const cond = search.values();
            return contains(user.username, cond.username) && contains(user.userNm, cond.userNm);
        }

        function contains(value, keyword) {
            return !keyword || (value || '').toLowerCase().indexOf(keyword.toLowerCase()) >= 0;
        }

        function renderRows(users) {
            Grid.render(gridBody, COLUMNS, (users || []).filter(matchesCondition), { emptyMessage: '등록된 사용자가 없습니다.' });
        }

        function searchUsers() {
            fetch(API_URL)
                .then(function (res) {
                    if (!res.ok) throw new Error('조회에 실패했습니다.');
                    return res.json();
                })
                .then(renderRows)
                .catch(function (err) {
                    alert(err.message);
                });
        }

        function addRow() {
            Grid.addRow(gridBody);
        }

        function saveAll() {
            const requests = [];

            for (const row of Grid.getRows(gridBody)) {
                const username = row.username;
                const userNm = row.userNm;
                const password = row.password;
                const role = row.role;
                const isExisting = !row._isNew;

                if (!username && !userNm && !password) {
                    continue;
                }
                if (!username || !userNm) {
                    alert('아이디, 사용자명은 필수입니다.');
                    return;
                }
                if (!isExisting && !password) {
                    alert('신규 사용자는 비밀번호가 필수입니다.');
                    return;
                }

                const payload = {
                    id: isExisting ? row.id : null,
                    username: username,
                    userNm: userNm,
                    password: password,
                    role: role
                };

                requests.push(fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }));
            }

            if (requests.length === 0) {
                return;
            }

            Promise.all(requests)
                .then(function (results) {
                    if (results.some(function (res) { return !res.ok; })) {
                        throw new Error('저장에 실패했습니다.');
                    }
                    searchUsers();
                })
                .catch(function (err) {
                    alert(err.message);
                });
        }

        function deleteSelected() {
            const rows = Grid.getRows(gridBody).filter(function (row) { return row._selected; });
            if (rows.length === 0) {
                alert('삭제할 사용자를 목록에서 선택하세요.');
                return;
            }
            if (!confirm('선택한 사용자를 삭제하시겠습니까?')) {
                return;
            }

            const requests = rows
                .filter(function (row) { return !row._isNew; })
                .map(function (row) { return fetch(API_URL + '/' + row.id, { method: 'DELETE' }); });

            // 저장 전 신규 행은 서버에 없으니 화면에서만 지운다.
            Grid.removeRows(gridBody, rows.filter(function (row) { return row._isNew; }));

            if (requests.length === 0) {
                return;
            }

            Promise.all(requests)
                .then(function (results) {
                    if (results.some(function (res) { return !res.ok; })) {
                        throw new Error('삭제에 실패했습니다.');
                    }
                    searchUsers();
                })
                .catch(function (err) {
                    alert(err.message);
                });
        }

        PageButtons.bind({
            btnSearch: searchUsers,
            btnAdd: addRow,
            btnSave: saveAll,
            btnDelete: deleteSelected,
            btnReset: function () {
                search.reset();
                searchUsers();
            }
        });

        // 역할 select 옵션(공통코드 "ROLE") 조회는 Grid.render가 알아서 하므로 바로 조회하면 된다.
        searchUsers();
    })();
</script>
</body>
</html>
