<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>앱 관리 · 보안취약점 모니터링 대시보드</title>
    <link rel="stylesheet" href="/css/common-ui.css">
    <link rel="stylesheet" href="/css/grid.css">
    <style>
        /* 화면 공통 뼈대(:root, .app-shell, .btn 등)는 common-ui.css가, .grid 공통 모양(패딩 포함)은
           grid.css가 담당한다. 이 화면은 기본값을 그대로 쓰므로 덮어쓸 규칙이 없다. */
    </style>
</head>
<body>
<div class="app-shell" th:classappend="${param.embed} ? 'app-shell--embedded'">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div th:replace="~{fragments/loading-overlay :: overlay}"></div>

    <main class="area-main">
        <section th:replace="~{fragments/page-toolbar :: toolbar}"></section>

        <section class="panel-head">
            <div class="panel-title">앱 목록</div>
        </section>

        <section>
            <table class="grid" id="appGrid">
                <thead id="appGridHead"></thead>
                <tbody id="appGridBody"></tbody>
            </table>
        </section>
    </main>
</div>

<script src="/js/grid.js"></script>
<script th:inline="javascript">
    (function () {
        const API_URL = '/api/apps';
        const gridBody = document.getElementById('appGridBody');

        const COLUMNS = [
            { type: 'row-select', width: 36, align: 'center' },
            { id: 'repoUrl', label: 'Repository URL', type: 'text' },
            { id: 'branch', label: 'Branch', type: 'text' },
            { id: 'systemName', label: '시스템명', type: 'text' },
            { id: 'description', label: '설명', type: 'text' }
        ];

        Grid.renderHeader(document.getElementById('appGridHead'), COLUMNS);

        function renderRows(apps) {
            Grid.render(gridBody, COLUMNS, apps, { emptyMessage: '등록된 앱이 없습니다.' });
        }

        function searchApps() {
            fetch(API_URL)
                .then(function (res) {
                    if (!res.ok) throw new Error('조회에 실패했습니다.');
                    return res.json();
                })
                .then(renderRows)
                .catch(function (err) {
                    alert(err.message);
                });
        }

        function addRow() {
            Grid.addRow(gridBody);
        }

        function saveAll() {
            const requests = [];

            for (const row of Grid.getRows(gridBody)) {
                const repoUrl = row.repoUrl;
                const branch = row.branch;
                const systemName = row.systemName;
                const description = row.description;

                if (!repoUrl && !branch && !systemName && !description) {
                    continue;
                }
                if (!repoUrl || !branch || !systemName) {
                    alert('Repository URL, Branch, 시스템명은 필수입니다.');
                    return;
                }

                const payload = {
                    id: row._isNew ? null : row.id,
                    repoUrl: repoUrl,
                    branch: branch,
                    systemName: systemName,
                    description: description
                };

                requests.push(fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }));
            }

            if (requests.length === 0) {
                return;
            }

            Promise.all(requests)
                .then(function (results) {
                    if (results.some(function (res) { return !res.ok; })) {
                        throw new Error('저장에 실패했습니다.');
                    }
                    searchApps();
                })
                .catch(function (err) {
                    alert(err.message);
                });
        }

        function deleteSelected() {
            const rows = Grid.getRows(gridBody).filter(function (row) { return row._selected; });
            if (rows.length === 0) {
                alert('삭제할 앱을 목록에서 선택하세요.');
                return;
            }
            if (!confirm('선택한 앱을 삭제하시겠습니까?')) {
                return;
            }

            const requests = rows
                .filter(function (row) { return !row._isNew; })
                .map(function (row) { return fetch(API_URL + '/' + row.id, { method: 'DELETE' }); });

            // 저장 전 신규 행은 서버에 없으니 화면에서만 지운다.
            Grid.removeRows(gridBody, rows.filter(function (row) { return row._isNew; }));

            if (requests.length === 0) {
                return;
            }

            Promise.all(requests)
                .then(function (results) {
                    if (results.some(function (res) { return !res.ok; })) {
                        throw new Error('삭제에 실패했습니다.');
                    }
                    searchApps();
                })
                .catch(function (err) {
                    alert(err.message);
                });
        }

        PageButtons.bind({
            btnSearch: searchApps,
            btnAdd: addRow,
            btnSave: saveAll,
            btnDelete: deleteSelected,
            btnReset: searchApps
        });

        searchApps();
    })();
</script>
</body>
</html>
