# 행안부 SW 보안약점 진단가이드 — 보안기능 / 주석문 안에 포함된 시스템 주요정보 (CWE-615)
#
# "운영 DB password: xxx" 같은 메모가 주석으로 저장소에 남는다. 언어와 무관하게 주석 기호 뒤의 "비밀값 이름 = 값"을 본다.
# 규칙 id에 hardcoded-secret이 들어가 있어 코드 조각·지문에서 값이 가려진다(SecureCodeSnippetBuilder). 자바 규칙과 파일을 나눈
# 이유는 hardcoded-secret-config.yml과 같다(semgrep --test가 같은 이름 예제를 파일 안 모든 언어로 파싱한다).
rules:
  - id: kisa-hardcoded-secret-comment
    languages: [generic]
    paths:
      include: ["*.java", "*.xml", "*.properties", "*.yml", "*.yaml", "*.jsp", "*.html", "*.js", "*.sql"]
      exclude: ["*.min.js"]
    patterns:
      # 주석 기호: 줄 첫머리의 # · *, // (URL의 :// 는 뺀다), <!--, /*, SQL의 --
      # 값 뒤에 ( . 글자가 이어지면 주석 처리된 코드(secretKey = Keys.hmacShaKeyFor(...))라 뺀다 — CRM_BACK에서 실제로 걸렸다.
      - pattern-regex: '(?im)(?:^[ \t]*(?:#|\*|--)|(?<![:\w])//|<!--|/\*)[^\n]*?(?:password|passwd|pwd|비밀번호|비번|secret|api[\-_.]?key|access[\-_.]?key)[\w.\-]*[ \t]*[=:][ \t]*[^\s''"<>$(]{4,}(?![\w.(])'
    message: "주석에 비밀번호·키로 보이는 값이 있습니다. 저장소에 남은 주석은 지워도 이력에 남습니다 — 값을 지우고, 실제 비밀번호였다면 바꾸세요."
    severity: ERROR
    metadata:
      kisa_category: 보안기능
      kisa_name: 주석문 안에 포함된 시스템 주요정보
      cwe: CWE-615
