# 행안부 SW 보안약점 진단가이드 — 에러처리 / 오류 메시지 정보노출(CWE-209), 오류상황 대응 부재(CWE-390)
rules:
  # 스택 트레이스를 표준 출력·응답으로 내보낸다. 운영 로그 체계(logger)를 거치지 않고, 서블릿 기본 오류 화면으로 사용자에게 보일 수도 있다.
  - id: kisa-error-stacktrace
    languages: [java]
    pattern-either:
      - pattern: $E.printStackTrace()
      - pattern: $E.printStackTrace(System.out)
      - pattern: $E.printStackTrace(System.err)
    paths:
      exclude: ["**/test/**", "**/*Test.java"]
    message: "printStackTrace로 예외 내부(클래스·경로·SQL)를 출력합니다. 로거(log.error(\"...\", e))로 남기고 사용자에게는 일반 문구만 보여주세요."
    severity: WARNING
    metadata:
      kisa_category: 에러처리
      kisa_name: 오류 메시지 정보노출
      cwe: CWE-209

  # 컨트롤러가 예외 메시지를 응답에 그대로 싣는다. DB 오류 메시지(테이블·컬럼·SQL), 내부 경로가 사용자에게 간다.
  # 직접 정한 문구의 예외(IllegalArgumentException 등)를 일부러 보여주는 경우도 걸린다 — 그런 곳은 오탐 처리한다(WARNING).
  - id: kisa-error-message-response
    languages: [java]
    patterns:
      - pattern-either:
          - pattern-inside: |
              @RestController
              class $C { ... }
          - pattern-inside: |
              @Controller
              class $C { ... }
          - pattern-inside: |
              @ControllerAdvice
              class $C { ... }
          - pattern-inside: |
              @RestControllerAdvice
              class $C { ... }
      - pattern-either:
          - pattern-inside: |
              try { ... } catch ($T $E) { ... }
          - pattern-inside: |
              @ExceptionHandler(...)
              $RET $M(..., $T $E, ...) { ... }
      - pattern-either:
          - pattern: return <... $E.getMessage() ...>;
          - pattern: return <... $E.toString() ...>;
          - pattern: $B.body(<... $E.getMessage() ...>)
          - pattern: new org.springframework.http.ResponseEntity<$R>(<... $E.getMessage() ...>, ...)
          - pattern: new org.springframework.http.ResponseEntity<>(<... $E.getMessage() ...>, ...)
          - pattern: (javax.servlet.http.HttpServletResponse $RESP).sendError($CODE, <... $E.getMessage() ...>)
          - pattern: (jakarta.servlet.http.HttpServletResponse $RESP).sendError($CODE, <... $E.getMessage() ...>)
          - pattern: $W.print(<... $E.getMessage() ...>)
          - pattern: $W.println(<... $E.getMessage() ...>)
          - pattern: $W.write(<... $E.getMessage() ...>)
    message: "예외 메시지를 응답에 그대로 내보냅니다(DB 오류의 테이블·SQL, 서버 경로 노출). 원인은 로그에 남기고 사용자에게는 정해 둔 문구만 보여주세요."
    severity: WARNING
    metadata:
      kisa_category: 에러처리
      kisa_name: 오류 메시지 정보노출
      cwe: CWE-209

  # 예외를 잡고 아무것도 하지 않는다. 인증·권한·저장 실패가 조용히 성공처럼 지나간다.
  # 일부러 무시하는 곳은 변수 이름을 ignored로 쓰면 뺀다(관례).
  - id: kisa-error-empty-catch
    languages: [java]
    patterns:
      - pattern: |
          try { ... } catch ($T $E) {}
      - metavariable-regex:
          metavariable: $E
          regex: ^(?!ignored?$|expected$).*
    paths:
      exclude: ["**/test/**", "**/*Test.java"]
    message: "예외를 잡고 아무 처리도 하지 않습니다. 실패가 성공처럼 지나갑니다. 로그를 남기고 실패를 호출자에게 알리세요(일부러 무시한다면 변수 이름을 ignored로 하고 이유를 주석으로 남기세요)."
    severity: WARNING
    metadata:
      kisa_category: 에러처리
      kisa_name: 오류상황 대응 부재
      cwe: CWE-390

  # Exception·Throwable을 통째로 잡아 처리한다. 널 참조·권한 오류 같은 예상 못 한 예외까지 같은 방식(로그 후 계속 등)으로 삼켜
  # 원인이 묻히고 실패한 상태로 처리가 이어진다. 건수가 많아 LOW(INFO)로 둔다 — 감싸서 다시 던지는 것과 빈 catch(위 규칙)는 뺀다.
  - id: kisa-error-broad-catch
    languages: [java]
    patterns:
      - pattern-either:
          # java.lang이라 import 없이 쓴다 — 짧은 모양과 패키지까지 쓴 모양을 다 둔다.
          - pattern: |
              try { ... } catch (Exception $E) { ... }
          - pattern: |
              try { ... } catch (java.lang.Exception $E) { ... }
          - pattern: |
              try { ... } catch (Throwable $E) { ... }
          - pattern: |
              try { ... } catch (java.lang.Throwable $E) { ... }
      - pattern-not: |
          try { ... } catch ($T $E) {}
      - pattern-not: |
          try { ... } catch ($T $E) { ... throw $X; }
    paths:
      exclude: ["**/test/**", "**/*Test.java"]
    message: "Exception·Throwable을 통째로 잡아 처리합니다. 예상하지 못한 예외까지 같은 방식으로 삼켜 원인이 묻힙니다. 처리할 수 있는 예외(IOException 등)만 잡고 나머지는 위로 던지세요."
    severity: INFO
    metadata:
      kisa_category: 에러처리
      kisa_name: 부적절한 예외 처리
      cwe: CWE-396
