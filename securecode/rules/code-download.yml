# 행안부 SW 보안약점 진단가이드 — 보안기능 / 무결성 검사 없는 코드 다운로드(CWE-494)
#
# URLClassLoader로 외부(원격 주소·업로드 폴더)의 jar·class를 불러 실행한다. 받은 코드가 바뀌었는지(서명·해시) 확인하지 않으면
# 중간에서 바꾼 코드가 서버 권한으로 실행된다. 서명·해시를 확인하는 곳이면 오탐 처리한다(WARNING).
rules:
  - id: kisa-code-download-classloader
    languages: [java]
    pattern-either:
      - pattern: new java.net.URLClassLoader(...)
      - pattern: java.net.URLClassLoader.newInstance(...)
    paths:
      exclude: ["**/test/**", "**/*Test.java"]
    message: "외부 jar·class를 불러 실행합니다. 받은 파일의 서명이나 해시를 확인한 뒤에만 불러오세요(가능하면 배포 패키지에 넣어 동적 로딩을 없애세요)."
    severity: WARNING
    metadata:
      kisa_category: 보안기능
      kisa_name: 무결성 검사 없는 코드 다운로드
      cwe: CWE-494
