# 행안부 SW 보안약점 진단가이드 — 입력데이터 검증 및 표현 / 운영체제 명령어 삽입 (CWE-78)
rules:
  # 요청값이 같은 메서드 안에서 명령 실행까지 그대로 흘러가는 경우 — 확실한 위험이라 ERROR.
  - id: kisa-os-command-injection-request
    languages: [java]
    mode: taint
    pattern-sources:
      - pattern: (HttpServletRequest $REQ).$GET(...)
      - pattern: (HttpServletRequest $REQ).getParameterValues(...)
      # Spring 요청 파라미터도 클라이언트 값이다(@RequestBody Map이면 param.get("x")로 꺼내도 오염이 따라간다).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RET $M(..., @RequestParam $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestParam(...) $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @PathVariable $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @PathVariable(...) $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestHeader(...) $T $P, ...) { ... }
              - pattern-inside: |
                  $RET $M(..., @RequestBody $T $P, ...) { ... }
          - pattern: $P
    pattern-sinks:
      - pattern: Runtime.getRuntime().exec(...)
      - pattern: (Runtime $RT).exec(...)
      - pattern: new ProcessBuilder(...)
      - pattern: (ProcessBuilder $PB).command(...)
    message: "요청값이 운영체제 명령 실행에 그대로 들어갑니다. 명령은 고정하고 인자는 허용 목록으로 검증하세요(셸(sh -c, cmd /c)을 거치지 마세요)."
    severity: ERROR
    metadata:
      kisa_category: 입력데이터 검증 및 표현
      kisa_name: 운영체제 명령어 삽입
      cwe: CWE-78

  # 명령을 문자열 상수가 아닌 값으로 실행하는 지점. 무료판 Semgrep은 메서드 밖에서 온 값을 추적하지 못해 출처는 모른다 —
  # 사람이 "이 값이 외부 입력에서 오는가"를 확인할 지점 목록이다. 셸을 거치는 경우(sh -c, cmd /c)는 인자 하나로 명령 전체가 바뀌어 특히 위험하다.
  - id: kisa-os-command-exec
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec($CMD, ...)
          - pattern: (Runtime $RT).exec($CMD, ...)
          - pattern: new ProcessBuilder($CMD, ...)
          - pattern: (ProcessBuilder $PB).command($CMD, ...)
      # 명령 전체가 문자열 상수 하나면 바뀔 여지가 없다.
      - pattern-not: Runtime.getRuntime().exec("...")
      - pattern-not: (Runtime $RT).exec("...")
      - pattern-not: new ProcessBuilder("...")
      # 모든 인자가 문자열 상수인 경우(new ProcessBuilder("git", "status"))도 뺀다.
      - pattern-not: new ProcessBuilder("...", "...")
      - pattern-not: new ProcessBuilder("...", "...", "...")
    message: "운영체제 명령을 변수로 실행합니다. 명령·인자가 외부 입력에서 오지 않는지 확인하고, 온다면 허용 목록으로 검증하세요."
    severity: WARNING
    metadata:
      kisa_category: 입력데이터 검증 및 표현
      kisa_name: 운영체제 명령어 삽입
      cwe: CWE-78
