# 행안부 SW 보안약점 진단가이드 — 입력데이터 검증 및 표현 / 부적절한 XML 외부 개체 참조 (CWE-611)
#
# JDK의 XML 파서는 기본값이 외부 개체(DTD·ENTITY)를 허용한다. 같은 메서드 안에서 막는 설정을 하지 않고 파서를 만들면 잡는다.
# 입력 XML이 신뢰할 수 있는 것(서버 내부 설정 파일)인지는 패턴으로 알 수 없어 WARNING이다.
rules:
  - id: kisa-xxe-parser
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: DocumentBuilderFactory.newInstance()
          - pattern: SAXParserFactory.newInstance()
          - pattern: XMLInputFactory.newInstance()
          - pattern: XMLInputFactory.newFactory()
          - pattern: TransformerFactory.newInstance()
          - pattern: SchemaFactory.newInstance(...)
          - pattern: new SAXReader()
          - pattern: new SAXBuilder()
      # DOCTYPE 자체를 금지하거나 외부 DTD·스키마 접근을 비우면 안전하다.
      - pattern-not-inside: |
          $RET $M(...) { ... $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true); ... }
      - pattern-not-inside: |
          $RET $M(...) { ... $F.setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD, ""); ... }
      - pattern-not-inside: |
          $RET $M(...) { ... $F.setProperty(XMLConstants.ACCESS_EXTERNAL_DTD, ""); ... }
      - pattern-not-inside: |
          $RET $M(...) { ... $F.setProperty(XMLInputFactory.SUPPORT_DTD, false); ... }
      - pattern-not-inside: |
          $RET $M(...) { ... $F.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true); ... }
    message: "XML 파서가 외부 개체(DTD·ENTITY)를 허용하는 기본값입니다. 외부 XML을 읽으면 서버 파일 유출·SSRF가 가능합니다. setFeature(\"http://apache.org/xml/features/disallow-doctype-decl\", true)로 DOCTYPE을 막으세요."
    severity: WARNING
    metadata:
      kisa_category: 입력데이터 검증 및 표현
      kisa_name: 부적절한 XML 외부 개체 참조
      cwe: CWE-611
