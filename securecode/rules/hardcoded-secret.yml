# 행안부 SW 보안약점 진단가이드 — 보안기능 / 하드코드된 중요정보 (CWE-798, CWE-259)
rules:
  - id: kisa-hardcoded-secret-java
    languages: [java]
    pattern-either:
      # 이름이 비밀값처럼 보이는 변수·필드에 문자열 리터럴을 넣는 경우.
      # 이름이 key/name/param/message 등으로 끝나면 "비밀값의 이름·문구"라 제외한다(PASSWORD_PARAM = "password", 비밀번호 생성용 문자 집합 PASSWORD_CHARS).
      - patterns:
          - pattern-either:
              - pattern: $T $V = "$S";
              - pattern: $V = "$S";
          - metavariable-regex:
              metavariable: $V
              regex: (?i)^(?!.*(key|name|path|url|param|header|field|label|msg|message|prefix|suffix|pattern|regex|type|code|policy|chars|charset|alphabet|length|len)$).*(password|passwd|pwd|secret|apikey|api_key|accesskey|access_key|privatekey|private_key|credential|token)
          - metavariable-regex:
              metavariable: $S
              # 빈 문자열·${...} 참조·공백이 든 문구는 비밀값이 아니다.
              regex: ^[^\s$]{4,}$
      - patterns:
          - pattern: $X.$SETTER("$S")
          - metavariable-regex:
              metavariable: $SETTER
              regex: ^set(Password|Passwd|Secret|ApiKey|AccessKey|SecretKey|PrivateKey|Token|Credentials?)$
          - metavariable-regex:
              metavariable: $S
              regex: ^[^\s$]{4,}$
    paths:
      exclude: ["**/test/**", "**/*Test.java"]
    message: "소스에 비밀번호·키·토큰으로 보이는 값이 있습니다. 설정 파일(저장소 제외)·환경변수·비밀 저장소에서 읽으세요."
    severity: ERROR
    metadata:
      kisa_category: 보안기능
      kisa_name: 하드코드된 중요정보
      cwe: CWE-798
