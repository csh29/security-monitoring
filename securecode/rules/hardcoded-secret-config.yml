# 행안부 SW 보안약점 진단가이드 — 보안기능 / 하드코드된 중요정보 (CWE-798)
# 자바 규칙과 파일을 나눈 이유: semgrep --test가 같은 이름의 테스트 파일을 규칙 파일 안 모든 언어로 파싱해서,
# 한 파일에 두면 .properties를 자바로 읽다가 구문 오류가 난다.
rules:
  # 저장소에 올라간 설정 파일의 비밀값. 값이 ${ENV} 참조면 안전하다.
  # Jasypt로 암호화한 값(ENC(...))은 가이드의 조치 방법(암호화 저장) 그 자체라 뺀다. 대신 저장소에 있으면 암호화가 무의미해지는
  # 복호화 키(jasypt.encryptor.password)는 이 규칙이 그대로 잡는다.
  - id: kisa-hardcoded-secret-config
    languages: [generic]
    paths:
      include: ["*.properties", "*.yml", "*.yaml"]
    pattern-regex: '(?im)^[ \t]*[\w.\-]*(password|passwd|secret|api[\-_.]?key|access[\-_.]?key|private[\-_.]?key|token)[\w.\-]*[ \t]*[=:](?![ \t]*[''"]?\$\{)(?![ \t]*[''"]?ENC\()[ \t]*[''"]?[^\s''"#$]{4,}'
    message: "설정 파일에 비밀값이 평문으로 있습니다. ${환경변수} 참조나 Jasypt 암호화(ENC(...))로 바꾸고, 복호화 키는 저장소 밖에 두세요."
    severity: ERROR
    metadata:
      kisa_category: 보안기능
      kisa_name: 하드코드된 중요정보
      cwe: CWE-798
