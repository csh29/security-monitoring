# MyBatis ${} 연계 추적 규칙 (MybatisDollarTracer / TraceRules)
#
# 코드 점검이 ${} 값의 출처를 Java 소스에서 따라갈 때, 시스템마다 다른 프레임워크 장치를 알려 주는 파일이다.
# 판정 로직에는 특정 시스템 이름을 넣지 않고 여기에만 둔다. 규칙은 대상 코드에 그 어노테이션·메서드가 있을 때만
# 적용되므로 여러 시스템의 항목을 같이 둬도 된다. 새 시스템을 점검 대상에 넣을 때 그 시스템이 로그인 정보를 어떻게
# 요청 값에 넣는지 확인하고 항목을 추가한다.
#
# 이 파일은 규칙 폴더(rules/) 밖에 둔다 — rules/ 안의 *.yml은 Semgrep이 규칙으로 읽는다.
# 여기에 없는 장치로 덮어쓰는 값은 클라이언트 값으로 판정된다(모르면 위험한 쪽으로).

# 요청 매핑 메서드에 붙으면 요청 맵의 키를 세션 값으로 덮어쓰는 장치(AOP·인터셉터 등).
#   annotation         요청 매핑 메서드에 붙는 어노테이션 이름
#   container          덮어쓰는 위치. 요청 맵 안의 이 키가 가리키는 맵(또는 맵 목록의 각 행). 비우면 요청 맵 자체
#   requiredFirstParam 이 타입이 첫 파라미터일 때만 동작(AOP 포인트컷이 args(request, ..)인 경우). 비우면 조건 없음
#   keys               세션 값으로 덮어쓰는 키
sessionOverwrites:
  # com.sjinc 사내 프레임워크(CRM 등) — UserInfoAspect가 @Before("@annotation(AddUserInfo) && args(request, ..)")로
  # FrameEtcUtil.addUserInfo를 불러 요청 맵의 paramData(맵 또는 맵 목록의 각 행)에 아래 키를 세션 값으로 넣는다.
  # regPgmId도 같이 넣지만 값이 클라이언트가 보낸 statement 앞 6자리라 세션 값이 아니다 — 넣지 않는다(점검 때 하는 추적 규칙 확인이 찾아냈다).
  - name: sjinc 프레임워크 @AddUserInfo
    annotation: AddUserInfo
    container: paramData
    requiredFirstParam: HttpServletRequest
    keys: [loginCompCd, loginUserId, loginUserNm, loginUserIp, loginBrndzCd, loginEmpNo]

# 이 이름으로 시작하는 메서드의 반환값은 로그인 정보(서버가 세션에서 꺼낸 값)로 본다.
# 예: loginUserVo.getLoginBrndzCd()
loginMethodPrefixes: [getLogin]

# 이 문자열이 타입 이름에 들어간 객체에서 꺼낸 값은 로그인 정보로 본다.
# 예: LoginUserVo loginUserVo = (LoginUserVo) session.getAttribute(...)
loginTypeNames: [LoginUser]

# 사용자 범위 키 — 매퍼 SQL의 조건 자리(WHERE·ON·HAVING)에 #{key}로 쓰이면 회사·브랜드·사용자로 데이터를 가르는 조건으로 본다(UserScopeFindings).
# INSERT VALUES·UPDATE SET 같은 값 자리는 등록자·수정자 기록이라 판정하지 않는다.
# 그 값을 클라이언트가 정할 수 있으면(세션 덮어쓰기·서버 세팅이 모든 경로에 없으면) "부적절한 인가"(kisa-authz-client-user-scope)로 탐지한다.
# 모든 시스템에 같이 적용되므로 시스템마다 그 시스템이 범위 조건에 쓰는 키를 추가한다. 이 목록의 키가 하나도 안 쓰이는 저장소는
# 점검 완료 알림에 "키를 찾지 못함"이 뜬다 — 그 시스템의 키를 여기에 넣으면 된다. 이름·IP처럼 기록용 값은 넣지 않는다.
# ${key}로 쓰인 키는 SQL 삽입 판정(kisa-sql-injection-mybatis-dollar)이 같은 방법으로 판정하므로 따로 내지 않는다.
userScopeKeys:
  # com.sjinc 사내 프레임워크(CRM 등) — @AddUserInfo가 세션 값으로 넣는 키 중 데이터 범위를 가르는 것
  - loginCompCd
  - loginBrndzCd
  - loginUserId
  - loginEmpNo
