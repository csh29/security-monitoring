# MyBatis ${} 연계 추적 규칙 (MybatisDollarTracer / TraceRules)
#
# 코드 점검이 ${} 값의 출처를 Java 소스에서 따라갈 때, 시스템마다 다른 프레임워크 장치를 알려 주는 파일이다.
# 판정 로직에는 특정 시스템 이름을 넣지 않고 여기에만 둔다. 규칙은 대상 코드에 그 어노테이션·메서드가 있을 때만
# 적용되므로 여러 시스템의 항목을 같이 둬도 된다. 새 시스템을 점검 대상에 넣을 때 그 시스템이 로그인 정보를 어떻게
# 요청 값에 넣는지 확인하고 항목을 추가한다.
#
# 이 파일은 규칙 폴더(rules/) 밖에 둔다 — rules/ 안의 *.yml은 Semgrep이 규칙으로 읽는다.
# 여기에 없는 장치로 덮어쓰는 값은 클라이언트 값으로 판정된다(모르면 위험한 쪽으로).
#
# 서버도 이 파일을 고친다(TraceRuleService). 코드 점검이 저장소 코드·설정 파일로 초안을 만들어,
#   - 판정을 엄격하게 하는 변경(세션 값이 아닌 키 빼기)과 프레임워크 구조 기록은 바로 고치고,
#   - 판정을 느슨하게 하는 변경(장치·키·로그인 정보 이름·사용자 범위 키 추가)은 코드 점검 화면 "추적 규칙 초안"에서 사람이 반영한다.
#     로그인 정보 이름·사용자 범위 키는 공통이 아니라 초안을 만든 시스템 항목(systems.시스템명)에 들어간다.
# 고친 곳 위에 "# 날짜 자동 반영|반영 사용자: … — 근거" 주석이 붙는다. 바뀐 내용은 git으로 확인해 커밋한다.
# 서버가 고칠 수 있게 keys·loginMethodPrefixes·loginTypeNames는 [a, b] 한 줄 목록으로 쓴다(모양이 다르면 자동 반영 대신 안내만 한다).
# 맨 끝 frameworks 섹션은 서버가 다시 쓰는 기록이라 손으로 고치지 않는다.

# 요청 매핑 메서드에 붙으면 요청 맵의 키를 세션 값으로 덮어쓰는 장치(AOP·인터셉터 등).
#   annotation         요청 매핑 메서드에 붙는 어노테이션 이름
#   container          덮어쓰는 위치. 요청 맵 안의 이 키가 가리키는 맵(또는 맵 목록의 각 행). 비우면 요청 맵 자체
#   requiredFirstParam 이 타입이 첫 파라미터일 때만 동작(AOP 포인트컷이 args(request, ..)인 경우). 비우면 조건 없음
#   keys               세션 값으로 덮어쓰는 키
sessionOverwrites:
  # com.sjinc 사내 프레임워크(CRM 등) — UserInfoAspect가 @Before("@annotation(AddUserInfo) && args(request, ..)")로
  # FrameEtcUtil.addUserInfo를 불러 요청 맵의 paramData(맵 또는 맵 목록의 각 행)에 아래 키를 세션 값으로 넣는다.
  # regPgmId도 같이 넣지만 값이 클라이언트가 보낸 statement 앞 6자리라 세션 값이 아니다 — 넣지 않는다(점검 때 하는 추적 규칙 확인이 찾아냈다).
  - name: sjinc 프레임워크 @AddUserInfo
    annotation: AddUserInfo
    container: paramData
    requiredFirstParam: HttpServletRequest
    keys: [loginCompCd, loginUserId, loginUserNm, loginUserIp, loginBrndzCd, loginEmpNo]

# 이 이름으로 시작하는 메서드의 반환값은 로그인 정보(서버가 세션에서 꺼낸 값)로 본다.
# 예: loginUserVo.getLoginBrndzCd()
loginMethodPrefixes: [getLogin]

# 이 문자열이 타입 이름에 들어간 객체에서 꺼낸 값은 로그인 정보로 본다.
# 예: LoginUserVo loginUserVo = (LoginUserVo) session.getAttribute(...)
loginTypeNames: [LoginUser]

# 사용자 범위 키 — 매퍼 SQL의 조건 자리(WHERE·ON·HAVING)에 #{key}로 쓰이면 회사·브랜드·사용자로 데이터를 가르는 조건으로 본다(UserScopeFindings).
# INSERT VALUES·UPDATE SET 같은 값 자리는 등록자·수정자 기록이라 판정하지 않는다.
# 그 값을 클라이언트가 정할 수 있으면(세션 덮어쓰기·서버 세팅이 모든 경로에 없으면) "부적절한 인가"(kisa-authz-client-user-scope)로 탐지한다.
# 여기(공통)에는 여러 시스템이 같이 쓰는 사내 프레임워크 키만 둔다. compCd처럼 흔한 이름은 시스템마다 뜻이 다를 수 있어(어떤 시스템에선
# 관리자가 고르는 조회조건) 아래 systems.시스템명에 둔다 — 공통에 넣으면 다른 시스템의 정상 화면이 "부적절한 인가"로 쏟아진다.
# 점검은 공통 + 그 시스템 항목으로 한다. 둘 다 하나도 안 쓰이는 저장소는 점검 완료 알림에 "키를 찾지 못함"이 뜬다. 이름·IP처럼 기록용 값은 넣지 않는다.
# ${key}로 쓰인 키는 SQL 삽입 판정(kisa-sql-injection-mybatis-dollar)이 같은 방법으로 판정하므로 따로 내지 않는다.
userScopeKeys:
  # com.sjinc 사내 프레임워크(CRM 등) — @AddUserInfo가 세션 값으로 넣는 키 중 데이터 범위를 가르는 것
  - loginCompCd
  - loginBrndzCd
  - loginUserId
  - loginEmpNo

# 시스템별 규칙 — 앱 관리의 시스템명 아래에 그 시스템에만 더하는 loginMethodPrefixes·loginTypeNames·userScopeKeys.
# 점검은 위 공통 목록에 점검하는 앱의 시스템 항목을 더해 쓴다. 코드 점검 화면 [추적 규칙 초안]에서 반영한 키·이름이 여기에 들어간다.
systems:
  "CRM_BACK":
    userScopeKeys:
      # 2026-10-08 반영 admin(공통에서 옮김): loginUserIp ← commonMapper.xml:67 #{loginUserIp}
      - loginUserIp
      # 2026-10-08 반영 admin(공통에서 옮김): compCd ← commonMapper.xml:10 #{compCd} ← LoginController.java:87 param.put("compCd", loginUserVo.getLoginCompCd())
      - compCd
      # 2026-10-08 반영 admin(공통에서 옮김): brndzCd ← crc020.xml:229 #{brndzCd} ← Crc020Controller.java:146 paraMap.put("brndzCd", loginUserVo.getLoginBrndzCd())
      - brndzCd
      # 2026-10-08 반영 admin(공통에서 옮김): ETC2 ← crc020.xml:421 #{ETC2} ← Crd010Service.java:138 sendParam.put("ETC2", loginUserVo.getLoginUserId())
      - ETC2
      # 2026-10-08 반영 admin(공통에서 옮김): userId ← commonMapper.xml:11 #{userId} ← Crd010Service.java:214 mailLogParam.put("userId", loginUserVo.getLoginUserId())
      - userId

# 프레임워크 구조 — 점검 때 서버가 시스템별로 설정 파일(빌드 파일·web.xml·Spring XML·application.yml 등)과 소스를 읽어 기록한다
# (FrameworkProfiler). 판정에는 쓰지 않는다. 위 규칙의 확인 대기 초안을 반영할지 판단할 때 그 시스템이 어떤 구조인지 보는 근거다.
# 구조가 바뀌면 다음 점검이 이 섹션을 다시 쓰므로 손으로 고치지 않는다.
frameworks:
  "CRM_BACK":
    - {kind: "웹", value: "Spring Boot 3.2.6", evidence: "pom.xml spring-boot 3.2.6"}
    - {kind: "웹", value: "Spring Boot MVC", evidence: "pom.xml spring-boot-starter-web"}
    - {kind: "웹", value: "Spring WebFlux", evidence: "pom.xml spring-boot-starter-webflux"}
    - {kind: "영속성", value: "MyBatis(Spring Boot)", evidence: "pom.xml mybatis-spring-boot-starter"}
    - {kind: "AOP", value: "Spring AOP(Spring Boot)", evidence: "pom.xml spring-boot-starter-aop"}
    - {kind: "필터", value: "Spring Security", evidence: "pom.xml spring-boot-starter-security"}
    - {kind: "설정 파일", value: "application-dev.properties", evidence: "src/main/resources/application-dev.properties"}
    - {kind: "설정 파일", value: "application-local.properties", evidence: "src/main/resources/application-local.properties"}
    - {kind: "설정 파일", value: "application-prod.properties", evidence: "src/main/resources/application-prod.properties"}
    - {kind: "영속성", value: "MyBatis", evidence: "src/main/resources/mybatis-config.xml <configuration>"}
    - {kind: "웹", value: "Spring Boot", evidence: "SjcrmApplication.java SjcrmApplication @SpringBootApplication"}
    - {kind: "인터셉터", value: "FrameHandlerInterceptorForToken", evidence: "SpringWebConfig.java addInterceptor(FrameHandlerInterceptorForToken)"}
    - {kind: "AOP", value: "어노테이션 AOP(@EnableAspectJAutoProxy)", evidence: "AopConfig.java AopConfig"}
    - {kind: "AOP", value: "@Aspect UserInfoAspect", evidence: "UserInfoAspect.java UserInfoAspect"}
  "OWASP Benchmark":
    - {kind: "웹", value: "Spring MVC", evidence: "pom.xml spring-webmvc"}
    - {kind: "영속성", value: "Hibernate", evidence: "pom.xml hibernate-core"}
    - {kind: "웹", value: "Spring MVC(web.xml DispatcherServlet)", evidence: "web.xml <servlet-class>org.springframework.web.servlet.DispatcherServlet"}
    - {kind: "필터", value: "DataBaseFilter", evidence: "web.xml <filter-class>org.owasp.benchmark.helpers.filters.DataBaseFilter"}
    - {kind: "필터", value: "HTTPResponseHeaderFilter", evidence: "web.xml <filter-class>org.owasp.benchmark.helpers.filters.HTTPResponseHeaderFilter"}
    - {kind: "필터", value: "HttpHeaderSecurityFilter", evidence: "web.xml <filter-class>org.apache.catalina.filters.HttpHeaderSecurityFilter"}
    - {kind: "웹", value: "Spring MVC(XML 설정)", evidence: "benchmark-servlet.xml <mvc:annotation-driven>"}
