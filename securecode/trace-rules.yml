sessionOverwrites:
  # 2026-10-12 반영 admin — CRM_BACK 점검 초안. 근거:
  #   UserInfoAspect.java:18 @Before("@annotation(com.sjinc.crm.frame.annotation.AddUserInfo) && args(request, ..)")
  #   loginCompCd ← FrameEtcUtil.java:47 map.put("loginCompCd", loginUserVo.getLoginCompCd())
  #   loginUserId ← FrameEtcUtil.java:48 map.put("loginUserId", loginUserVo.getLoginUserId())
  #   loginUserNm ← FrameEtcUtil.java:49 map.put("loginUserNm", loginUserVo.getLoginUserNm())
  #   loginUserIp ← FrameEtcUtil.java:50 map.put("loginUserIp", loginUserVo.getLoginUserIp())
  #   loginBrndzCd ← FrameEtcUtil.java:51 map.put("loginBrndzCd", loginUserVo.getLoginBrndzCd())
  #   loginEmpNo ← FrameEtcUtil.java:52 map.put("loginEmpNo", loginUserVo.getLoginEmpNo())
  #   regPgmId (세션 값 아님) ← FrameEtcUtil.java:53 map.put("regPgmId", hashMap.get("statement").toString().substring(0, 6))
  - name: "CRM_BACK @AddUserInfo"
    annotation: AddUserInfo
    container: paramData
    requiredFirstParam: HttpServletRequest
    keys: [loginCompCd, loginUserId, loginUserNm, loginUserIp, loginBrndzCd, loginEmpNo]

# 시스템별 규칙 — 앱 관리의 시스템명 아래에 그 시스템에만 더하는 loginMethodPrefixes·loginTypeNames·userScopeKeys.
# 점검은 위 공통 목록에 점검하는 앱의 시스템 항목을 더해 쓴다. 코드 점검 화면 [추적 규칙 초안]에서 반영한 키·이름이 여기에 들어간다.
systems:
  "CRM_BACK":
    loginTypeNames:
      # 2026-10-12 반영 admin: [LoginUserVo] 추가 — LoginUserVo ← FrameEtcUtil.java:16 (LoginUserVo) request.getSession().getAttribute(FrameConstants.LOGIN_USER_ATTR)
      - LoginUserVo
    loginMethodPrefixes:
      # 2026-10-12 반영 admin: [getLogin] 추가 — getLogin ← LoginUserVo의 getter 14개 공통 접두어
      - getLogin
    userScopeKeys:
      # 2026-10-12 반영 admin: [loginCompCd] 추가 — loginCompCd ← commonMapper.xml:23 #{loginCompCd}
      - loginCompCd
      # 2026-10-12 반영 admin: [loginUserId] 추가 — loginUserId ← commonMapper.xml:24 #{loginUserId}
      - loginUserId
      # 2026-10-12 반영 admin: [loginUserIp] 추가 — loginUserIp ← commonMapper.xml:67 #{loginUserIp}
      - loginUserIp
      # 2026-10-12 반영 admin: [loginBrndzCd] 추가 — loginBrndzCd ← commonMapper.xml:173 #{loginBrndzCd}
      - loginBrndzCd
      # 2026-10-12 반영 admin: [loginEmpNo] 추가 — loginEmpNo ← commonMapper.xml:66 #{loginEmpNo}
      - loginEmpNo
      # 2026-10-12 반영 admin: [compCd] 추가 — compCd ← commonMapper.xml:10 #{compCd} ← LoginController.java:87 param.put("compCd", loginUserVo.getLoginCompCd())
      - compCd
      # 2026-10-12 반영 admin: [brndzCd] 추가 — brndzCd ← crc020.xml:229 #{brndzCd} ← Crc020Controller.java:146 paraMap.put("brndzCd", loginUserVo.getLoginBrndzCd())
      - brndzCd
      # 2026-10-12 반영 admin: [ETC2] 추가 — ETC2 ← crc020.xml:421 #{ETC2} ← Crd010Service.java:138 sendParam.put("ETC2", loginUserVo.getLoginUserId())
      - ETC2
      # 2026-10-12 반영 admin: [userId] 추가 — userId ← commonMapper.xml:11 #{userId} ← Crd010Service.java:214 mailLogParam.put("userId", loginUserVo.getLoginUserId())
      - userId

# 프레임워크 구조 — 점검 때 서버가 시스템별로 설정 파일(빌드 파일·web.xml·Spring XML·application.yml 등)과 소스를 읽어 기록한다
# (FrameworkProfiler). 판정에는 쓰지 않는다. 위 규칙의 확인 대기 초안을 반영할지 판단할 때 그 시스템이 어떤 구조인지 보는 근거다.
# 구조가 바뀌면 다음 점검이 이 섹션을 다시 쓰므로 손으로 고치지 않는다.
frameworks:
