    - {kind: "웹", value: "Spring Boot 3.2.6", evidence: "pom.xml spring-boot 3.2.6"}
    - {kind: "웹", value: "Spring Boot MVC", evidence: "pom.xml spring-boot-starter-web"}
    - {kind: "웹", value: "Spring WebFlux", evidence: "pom.xml spring-boot-starter-webflux"}
